i mocks; share command responses"]}}, "meta": {"scan": "scan-9c353222845d488488972c88d4a12c43", "repo": "theCosmicCrafter/moshdither-studio", "date": "2026-11-01", "counts": {"critical": 2, "high": 13, "medium": 29, "low": 30, "total": 74}, "in_flight_prs": [{"pr": "#57", "finding": "sfind-aa750e3c", "what": "Remove the stale chromatic-to-spectral_shift legacy alias"}, {"pr": "#58", "finding": "sfind-0a24d44f", "what": "Datamoshing transforms key on Rust param names"}, {"pr": "#59", "finding": "sfind-e5f9639b", "what": "Seeded RNG in Frame Drop Advanced"}, {"pr": "#60", "finding": "sfind-c8bb1b34, sfind-333ca1ca", "what": "as_u64 float-drop in two effect files"}, {"pr": "#61", "finding": "sfind-830d6587", "what": "Typed Tauri command errors for SAM3"}, {"pr": "#62", "finding": "sfind-4c79f351", "what": "Split export_video_blocking god-function"}, {"pr": "none yet", "finding": "4 findings (session 1a7321aa)", "what": "Shared integer param reader + remaining as_u64/as_i64 sites"}]}, "findings": [{"id": "sfind-8c66c7b00a8f439690ac7b4a53ed3435", "sev": "critical", "title": "Integer params read with as_u64/as_i64 silently revert to hardcoded defaults after clamp_params; fix applied to 3 effects but not the rest", "cat": "duplicated-logic", "files": ["src-tauri/src/commands.rs:1346-1353", "src-tauri/src/effects/analog/chromatic_aberration.rs:49-52", "src-tauri/src/effects/artistic/posterize.rs:53-56", "src-tauri/src/effects/color/rgb_shift.rs:77-88", "src-tauri/src/effects/datamoshing/beat_sync.rs:34-36"], "pr": "", "rem": "1a7321aad1dc439284f2676bb7b6182a", "desc": "##### Overview Every effect parses its own params with `params.get(k).and_then(as_u64|as_i64).unwrap_or(default)`. `clamp_params` rewrites any out-of-range number through `serde_json::Number::from_f64`, which produces a float-tagged JSON number, and `as_u64()`/`as_i64()` return `None` for floats. So whenever a value is clamped (keyframes, audio bindings, out-of-range input) or the UI sends `8.0`, the integer param quietly drops back to the effect's hardcoded default instead of the clamped value. The repo already found and fixed this bug in `dithering.auto_palette`, `dithering.kmeans` and `dithering.error_diffusion`, and documented it in comments there. The other copies of the extraction boilerplate never got the fix. A shared typed param reader would close the bug everywhere and stop it coming back. ##### Maintainability Cost ``` clamp_value(): 25 -> number_value(20.0) -> Number::Float(20.0) chromatic_aberration: as_u64() -> None -> unwrap_or(self.shift=4) // user asked for max shift, gets 4 posterize bits 9 -> 8.0 -> as_u64 None -> 3 auto_palette/kmeans/error_diffusion: as_f64().round().clamp() // already fixed, with comments explaining this exact bug ``` The export loop in commands.rs re-clamps after keyframe and audio-binding injection (lines 1352, 1305, and the per-frame branches), so animated or audio-driven integer params are exactly the ones that get turned into floats. Sites in this batch that still use the broken pattern: chromatic_aberration `shift`, posterize `bits`, audio_reactive `block_size`/`levels`, channel_swap `mode`, rgb_shift `r/g/b_shift` (as_i64), beat_sync `u64_param` (hold_frames, smear_frames, every_nth_beat), combine `stride` (x2), iframe_removal `interval`, optical_flow `iterations`, and jpeg_quantize `quality`. The fix has already drifted across copies of one rule: three effects read integers correctly and roughly ten read them wrongly. Tiny per-file helpers (`u64_param` in beat_sync.rs, `audio_f32`/`f32_param` in audio_reactive.rs and audio_visual.rs, the `get_f32` closure in lift_gamma_gain.rs) show that people keep reinventing a reader that params.rs should provide. ##### Expected Impact - Clamped, keyframed and audio-bound integer params give the clamped value instead of silently snapping to a default. - One reader holds the integer-from-JSON rule, so a new effect can't bring the bug back. - The per-file helper copies and their explanatory comments can go. - Assumption: `serde_json` keeps `from_f64(20.0)` as a Float variant (no arbitrary_precision feature). The repo's own kmeans/auto_palette comments and tests confirm this.", "rec": "Add typed readers to effects/params.rs (e.g. `param_f32(params, key, default)`, `param_usize(params, key, default)`, and `param_i64`), implemented as `as_f64().filter(is_finite).map(round)`, the same logic auto_palette/kmeans already use. Replace every `as_u64()`/`as_i64()` integer param read and the local helpers (`u64_param`, `audio_f32`, `f32_param`, the `get_f32` closure) with them. Behavior stays the same for integer-tagged inputs. Float-tagged inputs now produce the clamped value instead of the default, which is the documented intent of clamp_params.", "phase": "P1"}, {"id": "sfind-aa750e3ceb3c4853ab24eb83a7f32066", "sev": "critical", "title": "Legacy alias rewrites the live audio_reactive.chromatic effect into spectral_shift on every preset/session load", "cat": "duplicated-logic", "files": ["src-tauri/src/effects/audio_visual.rs:333-345", "src/utils/effectConverter.ts:607-611", "src/utils/migrateOverlayGuides.ts:31-39", "src/utils/migrateOverlayGuides.ts:83-86"], "pr": "https://github.com/theCosmicCrafter/moshdither-studio/pull/57", "rem": "c1335c308bd14e0698ac857a7942c92d", "desc": "##### Overview `LEGACY_EFFECT_IDS` still maps `audio_reactive.chromatic` to `audio_reactive.spectral_shift`, and `LEGACY_PARAM_REMAP` has a matching entry. That made sense on 2026-08-04, when chromatic had been removed. On 2026-08-17 (commit ae7d64a) chromatic was added back as a live effect. It is registered in Rust (`registry.rs:145`, `audio_visual.rs:336`) and has a WebGL mapping (`effectConverter.ts:607`), but nobody removed the alias. Removing the two entries stops saved presets and sessions from silently changing effect type. ##### Maintainability Cost ``` user adds audio_reactive.chromatic {max_shift, direction} -> save preset / auto-save session -> load: usePresets.ts:294 / useProjectSession.ts:161 call migrateOverlayGuides() -> effectId := audio_reactive.spectral_shift, params {max_shift, direction} kept (no `intensity` to remap) -> spectral_shift ignores max_shift/direction, renders at its defaults ``` The legacy table and the live registry have drifted apart. The \"legacy\" ID is now a current effect. Every round-trip through presets or the session auto-save swaps the user's effect for a different one and throws away its settings. Nothing errors, and `migrated: true` reads as a routine migration. `migrateOverlayGuides.test.ts:146` locks in the stale behavior, so the test suite cannot catch it. ##### Expected Impact - Saved stacks that contain Audio Chromatic load back as Audio Chromatic with their parameters. - The legacy table again lists only IDs missing from the Rust registry, so it can be checked automatically. - Assumption: no older build ever saved a *different* chromatic effect that needs the spectral_shift remap. The pre-removal shape (`intensity` param) differs from the current one (`max_shift`, `direction`), so a remap keyed on the presence of `intensity` could keep both cases working.", "rec": "Remove `audio_reactive.chromatic` from `LEGACY_EFFECT_IDS` and `LEGACY_PARAM_REMAP`, and update `migrateOverlayGuides.test.ts:146`. If old pre-removal saves must still migrate, apply the rewrite only when the entry has `intensity` and lacks `max_shift`. Also add a unit test asserting that no key of `LEGACY_EFFECT_IDS` is a key of `rustToWebGL`. Every other ID behaves exactly as before.", "phase": "P1"}, {"id": "sfind-907c2d489e194c6f92ddb90a9402a874", "sev": "high", "title": "Copy-pasted param extraction uses as_u64()/as_i64(), which silently drops the float values that audio bindings, keyframes and clamping produce", "cat": "missing-abstraction", "files": ["src-tauri/src/commands.rs:477-495", "src-tauri/src/effects/glitch/png_chunk.rs:185-192", "src-tauri/src/effects/glitch/slice_shift.rs:69-77", "src-tauri/src/effects/noise/fractal.rs:89-92", "src-tauri/src/effects/params.rs:107-134"], "pr": "", "rem": "1a7321aad1dc439284f2676bb7b6182a", "desc": "##### Overview Every effect re-implements `params.get(k).and_then(|v| v.as_X()).unwrap_or(default)` inline, and there is no shared helper. About a dozen integer parameters in this batch read with `as_u64()` / `as_i64()`. In serde_json those return `None` for any float-backed `Number`, even a whole one like `20.0`. So when a value arrives as a float, the read quietly falls back to the struct default and the control does nothing. One typed helper (read as `f64`, then round and cast) would fix every site at once. ##### Maintainability Cost ``` commands.rs:491/591 params.insert(id, Value::from(v: f64)) // audio binding / keyframe injection params.rs:131 number_value() -> Number::from_f64(f) // clamp rewrites out-of-range ints as floats slice_shift.rs:71 .as_u64().unwrap_or(self.max_shift) // Float -> None -> default 20 fractal.rs:91, uniform.rs:55, block_shift.rs:71/75, png_chunk.rs:69/187/191, slice_shift_advanced.rs:111/115/121/127, anaglyph/kaleidoscope/mirror_slices/pixelate/pixel_sort ``` The export path writes every audio-bound and keyframed value as `Value::from(f64)`. `clamp_params` also rewrites any out-of-range integer as a float. Either way the value reaches these effects as a Float, `as_u64()` returns `None`, and the effect falls back to its default. Nothing is reported. `params.rs` already records the same failure class for `Select` params (\"the read silently fell through to the effect's hardcoded default and the control did nothing\"). The numeric version is still live because each effect has its own copy of the extraction. Because the boilerplate is copy-pasted across ~80 effect files, contributors keep picking `as_u64` or `as_f64` by habit, and the batch already contains both. ##### Expected Impact - Audio-bound, keyframed and clamped values for integer sliders (max_shift, slice_height, octaves, range, block_size, chunk_interval, shift_amount, …) start taking effect. - New effects get one obvious way to read a parameter, so this mistake can't come back. - Assumption: serde_json is built without `arbitrary_precision`, so `Number::as_u64` returns `None` for float-backed numbers. That is the default.", "rec": "Add helpers to effects/params.rs, for example `param_f32(params, key, default)`, `param_u32(params, key, default)` (reads as_f64, then rounds and casts so that both 20 and 20.0 work), `param_bool` and `param_str`. Replace the inline chains with these calls. For values that already arrive as integer JSON the results are identical. The only change is that float-valued integers stop being ignored, which is the intended behaviour. Note: Member of root-cause group sfind-8c66c7b00a8f439690ac7b4a53ed3435 (shared integer param extraction helper). Code owners: Cosmic Crafter \u003c61487138+theCosmicCrafter@users.noreply.github.com> Remediation session: 1a7321aad1dc439284f2676bb7b6182a", "phase": "P1"}, {"id": "sfind-0a24d44fa5bf4a08b96520661ce22668", "sev": "high", "title": "Datamoshing transforms branch on uniform names, but transform() receives the Rust param name, so the branches never run", "cat": "misleading-name", "files": ["src/utils/effectConverter.ts:336-348", "src/utils/effectConverter.ts:410-414", "src/utils/effectConverter.ts:657-665", "src/utils/effectConverter.ts:816-824"], "pr": "https://github.com/theCosmicCrafter/moshdither-studio/pull/58", "rem": "05ae6099b11047a19cdc5e895a358047", "desc": "##### Overview `WebGLMapping.transform` is documented as `(rustParam, value)`, and `stackToRenderPasses` calls it as `mapping.transform(rustParam, value)`. Thirteen datamoshing entries ignore that and test `_k === \"u_blockSize\"` or `_k === \"u_scale\"`, which are WebGL uniform names. Those conditions are never true. Every block-size or scale param therefore falls through to the intensity branch. Fixing this restores the intended conversions and gets rid of a bug the file has already fixed once in another entry. ##### Maintainability Cost ``` datamoshing.classic: paramMap { chunk_size: \"u_blockSize\" } transform(\"chunk_size\", 16) -> `_k === \"u_blockSize\"` is false -> returns 16/10 = 1.6 (should be 16) dithering.halftone comment (L338-342): \"tested uniform names against the rustParam argument, so it could never fire\" ``` This file is the main lookup table for preview parity. It has 23 commits and is imported by PreviewViewport, Toolbar, EffectStack, ExportPanel, browserFallback and others. The halftone comment shows this exact bug was found and fixed there, but 13 other entries still have it (classic, bloom, buffer, stop, shuffle, delay, iframe_removal_advanced, motion_transfer, optical_flow, profile_glitch, profile_bloom, profile_smear, profile_rainbow). The `_k` parameter name hides what the argument is, and the loose `(rustParam: string, ...)` signature can't catch the mistake. All of these entries are `accurate: false`, which usually sends the preview to the CPU path. That hides the wrong values: for example, block size 16 becomes 1.6 px and `drop_interval*4` is never applied. They show up whenever the WebGL passes are actually rendered. ##### Expected Impact - The block-size and scale conversions the code clearly intends start running in the WebGL preview path. - The same bug can't come back a third time if the transform key is typed as the entry's param keys. - Assumption: when the CPU preview is unavailable or still pending, the WebGL passes for `accurate:false` entries are rendered as an approximation. I didn't trace every fallback path.", "rec": "In each of the 13 datamoshing transforms, replace the uniform-name comparison with the Rust param key from that entry's paramMap (e.g. `k === \"chunk_size\"`, `k === \"drop_interval\"`, `k === \"block_size\"`, `k === \"alpha\"`), and rename `_k` to `rustParam`. To stop this recurring, add a unit test that asserts every branch key used in a transform is a key of that entry's paramMap. Alternatively, narrow the transform signature with a generic so the key is typed as `keyof paramMap`. For the CPU path nothing changes. For WebGL, the transforms now do what they were written to do. Note: Verified in source: transform receives the Rust param name (_k), but branches compare against uniform names like u_blockSize, so they never run (e.g. datamoshing.classic, datamoshing.bloom). Duplicates dismissed: sfind-11a82fa6a90f4376a591cc4c86a5de82, sfind-e1dd7a2d1901413ca2e228b3d3fb8540. Related same-file finding sfind-56884ea4ea604e6d90dadf5310da7e02 (key-blind transforms) should be fixed in the same pass. Code owners: Cosmic Crafter \u003c61487138+theCosmicCrafter@users.noreply.github.com> Remediation session: 05ae6099b11047a19cdc5e895a358047", "phase": "P1"}, {"id": "sfind-333ca1ca487c4d0d9f25c28a3284a9a1", "sev": "high", "title": "Four integer params here use the as_u64() read that drops float values", "cat": "other-silent-param-fallback", "files": ["src-tauri/src/effects/datamoshing/mv_effects.rs:245-248", "src-tauri/src/effects/datamoshing/mv_effects.rs:486-493", "src-tauri/src/effects/datamoshing/mv_effects.rs:614-617"], "pr": "https://github.com/theCosmicCrafter/moshdither-studio/pull/60", "rem": "d9df7a39d40d49bcbe833b75f42a5b49", "desc": "##### Overview `VibrateGlitch.randomness`, `StopGlitch.n_frames`, `BufferGlitch.buffer_size` and `DelayGlitch.delay_frames` are all read with `as_u64()`, and their fallbacks are hardcoded literals (10, 3, 5) that repeat the `ParameterDef` defaults. Keyframed, audio-bound, or clamped values reach these effects as floats, so the effects ignore them and use the literals. ##### Maintainability Cost ``` DelayGlitch: delay_frames keyframed -> Value::from(f64) -> as_u64() None -> unwrap_or(5) ``` Seven effects in this one file each re-parse params by hand, and each default is written twice: once in `meta()` and once as an `unwrap_or` literal. Changing a default means editing both, and nothing checks that they match. ##### Expected Impact - ()` returns `None` for float-tagged numbers. `clamp_params` writes every out-of-range value back as an f64 (`number_value(f.clamp(..))`). So an over-range or fractional value (from a UI wheel drag, an animation curve or an audio binding) is not clamped to max. It is quietly replaced with the hard-coded default. `halftone.rs` found this bug, documented it, fixed it locally and added regression tests. The same bug is still live in its siblings in this batch, because there is no shared integer-param reader. ##### Maintainability Cost ``` clamp_params(json!(9999)) -> json!(32.0) // halftone test asserts is_f64() halftone.rs: as_f64().round().clamp(..) // fixed, with comment + 2 tests color_bleed.rs:51 as_u64() -> None -> amount = 4 solarize.rs:51 as_u64() -> None -> threshold = 128 bloom.rs:143,173 shuffle.rs:57,87 motion_transfer.rs:69,92 cross_video.rs:121 overlay.rs:291,323 (plus ~80 as_u64 reads repo-wide) ``` The copies have already drifted: one site has the correct rule (read as f64, round, clamp) and the rest have the broken one. The failure is silent. The effect still renders, just with the default value, so users see a control that \"does nothing\" past its max, the same symptom halftone's comment describes. Every new integer-param effect copies the broken idiom because it is the dominant one. ##### Expected Impact - Out-of-range or fractional integer values clamp to the declared bound instead of snapping back to the default, in every effect at once. - One shared helper (e.g. `params::u32_param(params, key, fallback)`) replaces dozens of hand-copied chains, so the next effect can't reintroduce the bug. - Assumes the frontend or animation path can produce float-tagged or out-of-range values. The doc comment in params.rs and halftone's tests both say it can.", "rec": "Add a shared reader in effects/params.rs, e.g. `pub fn int_param(params, key, fallback: u64) -> u64` that does `as_f64().filter(is_finite).map(|v| v.round().max(0.0) as u64).unwrap_or(fallback)`, plus f32/str siblings (audio_visual.rs already has a private `f32_param`). Replace every `.and_then(|v| v.as_u64())` param read with it, starting with color_bleed, solarize, bloom, shuffle, motion_transfer, cross_video and overlay. For integer-tagged in-range values the result is identical. For float-tagged values the declared value is now honoured instead of the default, which is the behaviour halftone already adopted and tests for. An alternative is to have clamp_value preserve integer tagging when the input was an integer, but that still leaves fractional UI values broken. Note: Member of root-cause group sfind-8c66c7b00a8f439690ac7b4a53ed3435 (shared integer param extraction helper). Code owners: Cosmic Crafter \u003c61487138+theCosmicCrafter@users.noreply.github.com> Remediation session: 1a7321aad1dc439284f2676bb7b6182a", "phase": "P1"}, {"id": "sfind-64d5b6b494884ca28d924bae5297a1b1", "sev": "high", "title": "Integer params read with as_u64() silently ignore keyframed, audio-bound, and clamped values", "cat": "other-silent-param-fallback", "files": ["src-tauri/src/commands.rs:580-595", "src-tauri/src/effects/analog/ghosting.rs:69-72", "src-tauri/src/effects/analog/scanlines.rs:66-69", "src-tauri/src/effects/datamoshing/classic.rs:166-185", "src-tauri/src/effects/params.rs:129-133"], "pr": "", "rem": "1a7321aad1dc439284f2676bb7b6182a", "desc": "##### Overview Integer effect parameters (`offset` here, plus `gap`, `randomness`, `n_frames`, `buffer_size`, `delay_frames`, `chunk_size`, `repeats` in sibling effects) are read with `v.as_u64()`. In serde_json, `as_u64()` returns `None` for any number stored as a float. But the backend's own pipeline turns these values into floats: keyframe and audio-binding injection insert `Value::from(f64)`, and `clamp_params` rewrites out-of-range values through `Number::from_f64`. When that happens the read returns `None` and the effect quietly uses its hardcoded default. Fixing this with one shared, float-tolerant integer reader makes those controls work again. ##### Maintainability Cost ``` inject_keyframe_params -> Value::from(f64 4.0) -> ghosting as_u64() = None -> offset = self.offset (4) clamp_params(offset=25) -> number_value(20.0) (Float) -> as_u64() = None -> offset = 4, not 20 ``` The failure is silent. Animating `offset` or binding it to audio does nothing, and clamping an over-max value sends it back to the default instead of the max. No error or log is produced. The same `get().and_then(as_u64).unwrap_or(..)` line is repeated in at least 10 effects in this batch (ghosting, scanlines, classic, and 4 sites in mv_effects) and about 80 times across `effects/`, so every new integer param copies the bug. `beat_sync.rs` already has a private `u64_param` helper with the same flaw, which shows the missing shared abstraction. ##### Expected Impact - Keyframed, audio-bound, and clamped integer params take effect instead of falling back to defaults. - One helper replaces many copy-pasted extraction chains, so the next integer param can't repeat the bug. - Assumption: the frontend usually sends whole numbers as JSON integers, so static UI values work today. Only values that go through backend float conversion break. This is inferred from the code, not reproduced at runtime.", "rec": "Add a shared helper to `effects/params.rs`, for example `pub fn param_u64(params, key, fallback) -> u64`, that accepts an integer or a finite non-negative float (`v.as_u64().or_else(|| v.as_f64().filter(|f| f.is_finite() && *f >= 0.0).map(|f| f.round() as u64))`). Replace the `as_u64()` chains in every effect with it, and delete beat_sync's private `u64_param`. Values that were already JSON integers behave the same. Float values that were silently dropped are now honored. Add a test that sends `json!(5.0)` and an over-max value through clamp_params into Ghosting. Note: Member of root-cause group sfind-8c66c7b00a8f439690ac7b4a53ed3435 (shared integer param extraction helper). Code owners: Cosmic Crafter \u003c61487138+theCosmicCrafter@users.noreply.github.com> Remediation session: 1a7321aad1dc439284f2676bb7b6182a", "phase": "P1"}, {"id": "sfind-c8bb1b3428c747b28a27bdbc52e376ef", "sev": "high", "title": "Integer params read with as_u64() silently revert to defaults after clamp_params turns them into floats", "cat": "duplicated-logic", "files": ["src-tauri/src/effects/datamoshing/profiles.rs:116-119", "src-tauri/src/effects/datamoshing/profiles.rs:207-210", "src-tauri/src/effects/datamoshing/profiles.rs:254-261", "src-tauri/src/effects/dithering/line_screen.rs:86-96", "src-tauri/src/effects/params.rs:115-134"], "pr": "https://github.com/theCosmicCrafter/moshdither-studio/pull/60", "rem": "d9df7a39d40d49bcbe833b75f42a5b49", "desc": "##### Overview The datamosh profiles read `drop_interval`, `bloom_size` and `repeat_count` with `.and_then(|v| v.as_u64()).unwrap_or(\u003cmagic default>)`. The repo has already found this pattern to be wrong and fixed it elsewhere (line_screen.rs, error_diffusion_variants.rs): `as_u64()` returns `None` for any JSON float. Every value that `clamp_params` clamps comes back as a float, so the parameter is quietly dropped and the hardcoded default is used. A single shared integer-param helper would remove the bug and the repeated default literals. ##### Maintainability Cost ``` UI sends drop_interval=40 (max 30) -> clamp_params -> number_value(30.0) = Number::from_f64 (float) -> profiles.rs: v.as_u64() == None -> unwrap_or(8) // user asked for 30, gets 8 UI wheel drag sends 12.0 / 12.4 -> as_u64() None -> 8 line_screen.rs:86-96 documents this exact bug and reads as_f64().round().clamp() ``` `clamp_params` runs on every render path in commands.rs (lines 304, 1305, 1352, 1416, 1442). When it clamps, `number_value` returns a float `Number`. The profiles read these values as `u64`, so an out-of-range value does not stop at the limit. It goes back to the default. Each default is also a magic literal written twice, once in `meta()` and once at the read site (8, 3, 10). `bloom_size` is parsed separately in `process_frame` and in `process_video`. The same `as_u64` read appears in about 40 other effect files, so the line_screen fix never became a shared helper. ##### Expected Impact - Clamped or fractional integer parameters take effect instead of silently resetting to the default. - Each default is declared once (in `meta()`), so the declared default and the fallback cannot drift apart. - A shared helper gives the other ~40 `as_u64` sites a one-line fix. - Assumption: the frontend can send float-typed numbers for integer sliders. line_screen.rs's own comment and test assert this.", "rec": "Add a shared helper in effects/params.rs, e.g. `pub fn usize_param(params, key, default) -> usize` that does `as_f64().filter(is_finite).map(|v| v.round().max(0.0) as usize).unwrap_or(default)`. Replace the as_u64 reads in profiles.rs with it, parse bloom_size once per call, and hoist the defaults into named consts shared with `meta()`. Valid integer inputs behave exactly as before; only float-typed inputs change, from ignored to honoured. Note: Member of root-cause group sfind-8c66c7b00a8f439690ac7b4a53ed3435 (shared integer param extraction helper). Code owners: Cosmic Crafter \u003c61487138+theCosmicCrafter@users.noreply.github.com> Remediation session: d9df7a39d40d49bcbe833b75f42a5b49", "phase": "P1"}, {"id": "sfind-830d658755034205ad89539684612e3f", "sev": "high", "title": "Tauri command layer flattens every error to String; SAM3 recovery branches on message text", "cat": "inconsistent-error-handling", "files": ["src-tauri/src/commands.rs:140-170", "src-tauri/src/commands.rs:1650-1671", "src-tauri/src/error.rs:4-30"], "pr": "https://github.com/theCosmicCrafter/moshdither-studio/pull/61", "rem": "eb2495a46e214e15b6387c42327c1df2", "desc": "##### Overview commands.rs is the 4,300-line IPC surface of the app, with 42 commits in its history. Its 55 command signatures return `Result\u003c_, String>` and none return `AppError`, even though the crate defines typed `AppError` variants (Ffmpeg, Sam3Timeout, InvalidParameter, ...). Every inner error goes through `.map_err(|e| e.to_string())` or `format!`. The kind of error is lost at the boundary, so the one place that needs to react to a specific failure, SAM3 auto-restart, has to substring-match the message. ##### Maintainability Cost ``` Sam3Engine error -> e.to_string() -> if err_str.contains(\"pipe\") || contains(\"closed\") || contains(\"os error\") -> restart mutex poison: 25 hand-written .map_err(|e| format!(\"... lock poisoned: {e}\")) Task join: repeated .map_err(|e| format!(\"Task failed: {}\", e))?? ``` The restart heuristic depends on the wording of error messages. Any SAM3 message containing \"closed\" (or any IO error) triggers a restart. A real pipe failure worded differently does not. Rewording an error message elsewhere can silently change recovery behaviour. Tests also assert on message substrings (`contains(\"Cancelled\")`, `contains(\"timed out\")`), which fixes the wording in place. The 25 copies of the lock-poison mapping and the repeated spawn_blocking join mapping are boilerplate that each new command copies again. ##### Expected Impact - SAM3 restart keys off a typed variant (e.g. a `Sam3Pipe`/`Io` kind) instead of message text. - Lock and join errors are handled in one `From` impl or helper instead of 25+ inline closures. - The frontend could receive a structured `{kind, message}`. Assumption: AppError would need a `Serialize` impl, which it does not have today.", "rec": "Implement `serde::Serialize` for AppError (serialise as its Display string so the frontend contract is unchanged) and add `From\u003cPoisonError\u003c_>>` / `From\u003ctauri::Error>` conversions. Then migrate commands to `Result\u003cT, AppError>` incrementally, starting with the SAM3 path: have `Sam3Engine` return a typed pipe/IO variant and match on it in the restart logic. Frontend behaviour stays the same because the serialised payload is still the message string.", "phase": "P1"}, {"id": "sfind-4c79f351b02840268522941cb8236bf6", "sev": "high", "title": "export_video_blocking is a 500-line, 19-parameter god-function hidden behind a module-wide clippy allow", "cat": "god-function", "files": ["src-tauri/src/commands.rs:1-1", "src-tauri/src/commands.rs:1032-1075", "src-tauri/src/commands.rs:1285-1472", "src-tauri/src/commands.rs:1407-1460"], "pr": "https://github.com/theCosmicCrafter/moshdither-studio/pull/62", "rem": "f51339047c37445da0cbd35f75293a7e", "desc": "##### Overview `export_video_blocking` does all of the following in one 503-line body: - parses trim points out of the output filename - plans the memory budget - decodes - duplicates still images into frames - trims - runs three different effect-application strategies (temporal, rayon, and audio-sequential), each with keyframe, audio and mask handling - picks the codec - encodes - emits about 10 progress events It takes 19 positional parameters, many of them `Option`. The file-level `#![allow(clippy::too_many_arguments)]` hides that. Splitting it into an options struct and stage helpers would make the export path, the app's main write path, reviewable. ##### Maintainability Cost ``` export_video_blocking(registry, app_handle, source_path, output_path, stack, mask_b64, codec, fps, width, height, audio_bake_json, watermark, trim_start, trim_end, format, quality, include_audio, processing_scale, cancel) // 19 args, lines 1032-1535 ``` The body's own comments record several past defects fixed in place: a mask-blend panic on frame-repeating effects, cancel only being polled during encode, still-image cloning that aborted with 14.6 GB allocations, and include_audio being mutually exclusive with the audio bake. The effect loop alone is about 190 lines with three branches that each repeat the clone-params, insert-time, inject-keyframes, re-clamp sequence. Filename-encoded trim parsing (`_trim_0.5-2.3`) is a hidden behavior buried at the top. commands.rs has 42 commits of churn, and every export change goes through this function. ##### Expected Impact - Each stage (plan/decode, trim, apply-stack, encode) becomes testable on its own. - The per-frame param preparation (time + keyframes + audio + re-clamp) lives in one place instead of three branches. - With an `ExportOptions` struct, the module-wide clippy allow can be removed.", "rec": "Introduce an `ExportOptions` struct for the optional parameters. Extract `plan_and_decode`, `apply_trim`, `apply_effect_to_segment` (with one `frame_params_at(t)` helper shared by both non-temporal branches) and `encode_output`, keeping the same order and the same cancel checks. Move filename trim parsing into a named helper. Behavior is preserved because the steps and their order are unchanged and only regrouped. Code owners: Cosmic Crafter \u003c61487138+theCosmicCrafter@users.noreply.github.com> Remediation session: f51339047c37445da0cbd35f75293a7e", "phase": "P1"}, {"id": "sfind-bea31837b1b14304a840fa4a74deaddd", "sev": "medium", "title": "Integer params read with as_u64, which drops JSON floats and falls back to the default", "cat": "inconsistent-error-handling", "files": ["src-tauri/src/commands.rs:489-492", "src-tauri/src/effects/datamoshing/iframe_removal_advanced.rs:122-133", "src-tauri/src/effects/datamoshing/rise.rs:100-103", "src-tauri/src/effects/dithering/error_diffusion.rs:215-222"], "pr": "", "rem": "", "desc": "##### Overview `start_frame`, `end_frame` and `frame_number` are read with `.as_u64()`. serde_json returns `None` for any JSON float, including `100.0`, so the code falls back to the hard-coded default without any error. The repo has already hit this bug and documented the fix in `error_diffusion.rs`: read with `as_f64` and then cast. ##### Maintainability Cost ``` error_diffusion.rs:215 \"Read as f64, not as_u64: a slider ... may still serialise as 8.0, and as_u64() returns None\" + test levels_accepts_a_json_float_from_a_slider iframe_removal_advanced.rs:122-133 as_u64 x3 -> silent default rise.rs:100-103 as_u64 -> silent default ``` The backend also writes float values itself: `commands.rs` `inject`/`inject_keyframe_params` insert `Value::from(f64)` for keyframed and audio-bound params. Any of these params that arrives as a float makes the effect ignore the user's value. The defaults are also a second copy of the `ParameterDef` defaults in `meta()`, so the two can drift. ##### Expected Impact - Float inputs no longer reset these params to their defaults without warning. - Brings these effects in line with the documented `error_diffusion` convention. - Assumption: temporal effects don't currently get per-frame keyframe injection, so the trigger is a float sent by the frontend or a project file. That path is plausible but I didn't confirm it.", "rec": "Add a shared helper such as `effects::params::usize_param(params, key, default)` that reads `as_f64()` and then casts (clamped at >= 0), and use it here and in `rise.rs`. Integer inputs give the same result; float inputs are now honoured instead of dropped. Note: Member of root-cause group sfind-8c66c7b00a8f439690ac7b4a53ed3435 (shared integer param extraction helper). Code owners: Cosmic Crafter \u003c61487138+theCosmicCrafter@users.noreply.github.com>", "phase": "P2"}, {"id": "sfind-22503f5e1fc94a8cae70c0e93446928f", "sev": "medium", "title": "Param extraction boilerplate repeated in every effect with no shared helper", "cat": "missing-abstraction", "files": ["src-tauri/src/effects/audio_visual.rs:23-28", "src-tauri/src/effects/color/brightness_contrast.rs:123-139"], "pr": "", "rem": "", "desc": "##### Overview Every effect re-implements `params.get(k).and_then(|v| v.as_f64()).unwrap_or(\u003cliteral>) as f32` and repeats each default literal from its own `ParameterDef`. Two modules have already written private copies of a helper (`audio_visual::f32_param`, `beat_sync::u64_param`), but nothing is shared. ##### Maintainability Cost ``` brightness_contrast meta(): gamma default 1.0, min 0.1 | process_frame: unwrap_or(1.0), then .clamp(0.01, 10.0) ``` In this file, each of the 4 params is declared and then re-parsed by hand. The gamma read also adds a second clamp range (0.01–10) that disagrees with the declared range (0.1–3.0). Readers can't tell which range is authoritative. More than 110 such chains in this batch alone make default drift easy and hard to spot. ##### Expected Impact - One helper for reading params, so the next effect doesn't copy-paste extraction code. - Each default and range has one source of truth. - Assumption: the clamp_params range always runs first, which makes the inner clamp dead in practice.", "rec": "Move a `param_f32(params, key, fallback)` helper into `effects/params.rs` next to clamp_params (alongside `param_u64`), and replace the inline chains. The helper body is the same chain, so results don't change. Note: Member of root-cause group sfind-8c66c7b00a8f439690ac7b4a53ed3435 (shared integer param extraction helper). Code owners: Cosmic Crafter \u003c61487138+theCosmicCrafter@users.noreply.github.com>", "phase": "P2"}, {"id": "sfind-aa2997f2a710440ca7bfb16363a249ba", "sev": "low", "title": "Eight param defaults restated as literals instead of the schema/struct, with no shared extraction helper", "cat": "magic-values", "files": ["src-tauri/src/effects/analog/vhs.rs:150-190", "src-tauri/src/effects/analog/vhs.rs:76-132"], "pr": "", "rem": "", "desc": "##### Overview `process_frame` reads ten params with copy-pasted `get().and_then(as_f64).unwrap_or(..)` chains. Two fall back to struct fields. Eight fall back to bare literals (0.1, 0.0, 8.0, 0.3, 0.2...) that restate the `default: json!(..)` values from `meta()` 30-130 lines above. Each default now lives in two places with nothing tying them together. ##### Maintainability Cost ``` meta(): tracking_error default json!(0.1) | process_frame: unwrap_or(0.1) slice_size default json!(8.0) | unwrap_or(8.0) chroma_bleed default json!(0.2) | unwrap_or(0.2) ``` No drift exists yet; all the literals currently match. Retuning a default in `meta()` silently leaves the fallback at the old value, and the 40 lines of boilerplate hide which params are actually special. ##### Expected Impact - One place to change each default. - About 40 lines of boilerplate shrink to about 10. - Assumes the fallback path is reachable (it is when a param key is missing, e.g. older presets).", "rec": "Use a shared `f32_param(params, key, fallback)` helper (move audio_visual.rs's private one into effects/params.rs). Source the fallbacks from named consts that are also used in `meta()`'s `default: json!(CONST)`. Behaviour is identical because the values are the same. Note: Member of root-cause group sfind-8c66c7b00a8f439690ac7b4a53ed3435 (shared integer param extraction helper). Code owners: Cosmic Crafter \u003c61487138+theCosmicCrafter@users.noreply.github.com>", "phase": "P2"}, {"id": "sfind-69ae4103676c44a88f7d4f8ee7b66ece", "sev": "low", "title": "process_frame and process_video duplicate param extraction and overlay path resolution", "cat": "duplicated-logic", "files": ["src-tauri/src/effects/composite/overlay.rs:284-302", "src-tauri/src/effects/composite/overlay.rs:316-340"], "pr": "", "rem": "", "desc": "##### Overview `process_frame` and `process_video` each repeat the same opacity, blend_mode and overlay_path extraction, the empty-path early return, and the `locate_overlay_file` plus not-found error. About 20 lines are duplicated verbatim. ##### Maintainability Cost ``` process_frame 284-302 == process_video 316-340 (param reads + resolve + error) ``` No drift yet. But this effect's path-handling rules are security-relevant (overlays/ subtree restriction, error text), and any change to the not-found handling or blend_mode parsing has to be made twice. The blend_mode `as_u64` read appears twice, so the integer-param fix also has to land twice. ##### Expected Impact - One resolution path for preview and export. - Assumes the two paths are meant to behave identically. They do today.", "rec": "Extract `fn resolve(&self, params) -> Result\u003cOption\u003c(f32, u32, Vec\u003cFrame>)>>` that returns None for an empty path, and call it from both methods. Behaviour is unchanged. Code owners: Cosmic Crafter \u003c61487138+theCosmicCrafter@users.noreply.github.com>", "phase": "P2"}, {"id": "sfind-56884ea4ea604e6d90dadf5310da7e02", "sev": "medium", "title": "Key-blind transforms apply one scaling to every mapped param (crc_mismatch divides slice height by 100)", "cat": "duplicated-logic", "files": ["src/utils/effectConverter.ts:498-508", "src/utils/effectConverter.ts:567-573", "src/utils/effectConverter.ts:627-631"], "pr": "", "rem": "", "desc": "##### Overview Several entries map two or more Rust params but give a `transform` that ignores the key. `glitch.crc_mismatch` maps both `scanline_interval -> sliceHeight` and `shift_amount -> amount` through `v / 100`. The slice-height uniform therefore gets a fraction below 1. Every other slice_shift mapping (`glitch.slice_shift`, `pixel_geo.slice_shift_advanced`) clamps sliceHeight with `Math.max(1, n)`. `audio_reactive.beat_glitch` likewise sends `trigger_threshold` to `u_sliceHeight` with `/100`. Defining the scaling per param would make these mismatches visible. ##### Maintainability Cost ``` glitch.slice_shift sliceHeight = max(1, n) amount = min(1, n/100) slice_shift_advanced sliceHeight = max(1, n) amount = |n|/64 glitch.crc_mismatch sliceHeight = n/100 (!) amount = n/100 ``` Three mappings feed the same shader uniform, and the third has drifted away from the other two. With one shared closure per entry, adding a param silently inherits another param's scaling. ##### Expected Impact - sliceHeight gets consistent handling across all slice_shift users. - Adding a param to an entry forces an explicit decision about how it is scaled. - Assumption: `scanline_interval` is in pixels, like the other sliceHeight sources.", "rec": "Give crc_mismatch (and beat_glitch) per-key branches that match the slice_shift siblings (`if (k === \"scanline_interval\") return Math.max(1, n)`), or extract a shared `sliceShiftTransform(heightKey, amountKey, amountScale)` helper used by all three slice_shift mappings. Only the sliceHeight value changes. Amount scaling stays the same. Code owners: Cosmic Crafter \u003c61487138+theCosmicCrafter@users.noreply.github.com>", "phase": "P3"}, {"id": "sfind-806f34457ab44a068f4f48acd7859a01", "sev": "medium", "title": "WebGLContext create* methods leak GL objects (shaders never deleted, named slots silently overwritten), forcing EffectChain to manage the cache's internals", "cat": "leaky-abstraction", "files": ["src/engine/webgl2/EffectChain.ts:130-138", "src/engine/webgl2/EffectChain.ts:496-521", "src/engine/webgl2/WebGLContext.ts:109-150", "src/engine/webgl2/WebGLContext.ts:89-107"], "pr": "", "rem": "", "desc": "##### Overview `WebGLContext` acts as the named owner of GL resources, but its create methods do not maintain that ownership. `getOrCreateProgram` never deletes the vertex/fragment shaders after linking, and on a link failure it throws without deleting the program or the shaders. `createTexture`/`createFramebuffer` overwrite an existing name in the map without deleting the previous object. Because of this, `EffectChain.resize` has to fetch and delete the six old objects itself before calling create again. Every caller has to know about this hidden requirement. ##### Maintainability Cost ``` getOrCreateProgram: createShader(vs), createShader(fs) -> link -> (never deleteShader) ; link fail -> throw (program+shaders leaked) createTexture(name): this.textures.set(name, tex) // old tex under `name` orphaned EffectChain.resize 501-520: getTexture x3 / getFramebuffer x3 -> gl.delete* x6 -> create* x6 // caller compensates EffectChain.ensurePingPongTextures 130-138: same six create calls duplicated ``` This class is the core of the GPU preview path (used by PreviewViewport, EffectChain, FullscreenQuad, and the LUT loader). It has a recent churn history around leak and lifetime bugs (commits 25dd4ac, b31d84e). A new caller that resizes or recreates a named texture through the documented API leaks GPU memory and gets no signal. ##### Expected Impact - Named slots own their objects. Recreating a name frees the old one, so EffectChain.resize shrinks to a create loop and new callers cannot leak. - Shader objects are freed after link, and failed links clean up. - The duplicated six-call ping-pong setup collapses to one helper. - Assumes no caller relies on a previously returned texture handle staying valid after recreating the same name (EffectChain already deletes it, so none does today).", "rec": "In createTexture/createFramebuffer, delete any existing object under `name` before `set`. In getOrCreateProgram, call `gl.deleteShader(vs/fs)` after a successful link, and on failure delete the program and shaders before throwing. Then remove the manual deletion block from EffectChain.resize and route both sites through one `allocPingPong(w,h)`. The GL state that results is the same as today, minus the leaked objects. Code owners: Cosmic Crafter \u003c61487138+theCosmicCrafter@users.noreply.github.com>", "phase": "P3"}, {"id": "sfind-363283d827d64cfaa0f215c9beda6721", "sev": "low", "title": "Ping-pong FBO setup duplicated between ensurePingPongTextures and resize", "cat": "duplicated-logic", "files": ["src/engine/webgl2/EffectChain.ts:130-139", "src/engine/webgl2/EffectChain.ts:500-521"], "pr": "", "rem": "", "desc": "##### Overview The six lines that create `fbo_a/b/c` and `fb_a/b/c` appear in both `ensurePingPongTextures` and `resize`. `resize` also deletes each of the six resources by hand. Adding a fourth buffer, or changing the texture format, means editing three lists that must stay in sync. ##### Maintainability Cost ``` ensurePingPongTextures L132-137: createTexture x3, createFramebuffer x3 resize L502-520: getTexture/getFramebuffer x6, delete x6, createTexture x3, createFramebuffer x3 ``` EffectChain is the GPU render core (11 commits). If one list misses a buffer, the old buffer leaks or the new one is never created at the new size, and nothing reports an error. The lists match today. ##### Expected Impact - A single `PINGPONG = [\"a\",\"b\",\"c\"]` loop or `allocPingPong(w,h)` / `freePingPong()` pair removes the three parallel lists.", "rec": "Add private `allocPingPong(w,h)` and `freePingPong()` methods that loop over `[\"a\",\"b\",\"c\"]`. Call alloc from `ensurePingPongTextures`, and free then alloc from `resize`. The GL calls and their order stay the same. Code owners: Cosmic Crafter \u003c61487138+theCosmicCrafter@users.noreply.github.com>", "phase": "P3"}, {"id": "sfind-ed3a65ca42054b25813662fe220776f4", "sev": "medium", "title": "Inline __TAURI_INTERNALS__ cast duplicates isTauriAvailable(), which the same file already uses", "cat": "duplicated-logic", "files": ["src/components/AppLayout.tsx:112-115", "src/components/AppLayout.tsx:274-279", "src/components/WindowControls.tsx:43-51", "src/hooks/useKeyboardShortcuts.ts:329-338", "src/lib/browserFallback.ts:115-118"], "pr": "", "rem": "", "desc": "##### Overview AppLayout's close guard calls the shared `isTauriAvailable()` helper. Its drag-drop effect, about 160 lines later, does its own check instead: `(globalThis as Record\u003cstring, unknown>).__TAURI_INTERNALS__`. The same hand-rolled check, with a different cast each time, also appears in WindowControls, useKeyboardShortcuts and ErrorBoundary. Using the one helper everywhere removes the casts and the drift. ##### Maintainability Cost ``` browserFallback.ts:115 isTauriAvailable(): \"__TAURI_INTERNALS__\" in globalThis AppLayout.tsx:114 isTauriAvailable() \u003c- helper AppLayout.tsx:276 !(globalThis as Record\u003cstring,unknown>).__TAURI_INTERNALS__ \u003c- truthiness, own cast WindowControls.tsx:45 (globalThis as unknown as {__TAURI_INTERNALS__?: unknown}) useKeyboardShortcuts:332 same double cast ``` The copies already disagree on semantics: the helper uses `in`, the inline copies test truthiness. The comment at 105-111 records that partial Tauri globals under the E2E mock once took the whole UI down. Detection logic like this should live in one place so any later fix to it reaches every caller. AppLayout is the root layout and is changed often. ##### Expected Impact - One definition of \"running inside Tauri\". Fixes to it, such as also checking `metadata.currentWindow`, apply everywhere. - Removes the `as unknown as` and `Record\u003cstring, unknown>` casts from the components. - Assumption: `in` vs truthiness gives the same answer for the real runtime and the E2E mock, since both define the global as an object.", "rec": "Replace the inline checks at AppLayout.tsx:276, WindowControls.tsx:45 and useKeyboardShortcuts.ts:332 with `isTauriAvailable()`. Optionally add a `getCurrentWindowSafe()` in lib that wraps the try/catch the three window callers each repeat. Behavior is unchanged in both Tauri and browser mode.", "phase": "P4"}, {"id": "sfind-5ef357cebb2a4c108fac6f180ca341b3", "sev": "medium", "title": "appWindow is rebuilt on every render, re-subscribing onResized each render; IPC failures swallowed with a misleading comment", "cat": "other-unstable-dependency", "files": ["src/components/WindowControls.tsx:118-132", "src/components/WindowControls.tsx:43-77"], "pr": "", "rem": "", "desc": "##### Overview `appWindow` is computed in an IIFE in the render body, so `getCurrentWindow()` returns a new `Window` object on every render. `sync` (useCallback deps `[appWindow]`) and the subscription effect (deps `[appWindow, sync]`) therefore re-run on every render: the effect unlistens, calls `onResized` again, and does another `sync()` IPC round-trip. Separately, every window and dock IPC failure is caught and discarded with no `logger.warn`. The dock catch says \"AppBar not supported on this platform\", but the button only renders on Windows, so that catch actually hides real failures. ##### Maintainability Cost ``` render -> getCurrentWindow() (new object) -> sync identity changes -> useEffect cleanup+resubscribe -> sync() IPC -> setState ``` Any store change that re-renders the toolbar (edgeSnapEnabled, appBarDocked) re-registers the native resize listener. The memoization looks correct but does nothing, which invites more stale-closure bugs. Failed dock, maximize, and fullscreen calls leave the UI unchanged with no record, which goes against the repo's logger convention for release builds. ##### Expected Impact - A stable `appWindow` (useMemo/useState initializer) makes the effect subscribe once. - `logger.warn` in the catches makes window-control failures visible in the log file. - Assumption: Tauri v2 `getCurrentWindow()` returns a fresh Window instance per call, so identity is not stable (not verified locally; node_modules absent).", "rec": "Compute `appWindow` once: `const [appWindow] = useState(() => isTauriAvailable() ? safeGetCurrentWindow() : null)`. Replace the empty catches with `logger.warn(\"WindowControls\", ...)`. Rendering and state transitions are the same; the redundant re-subscriptions stop and failures get logged. Code owners: Cosmic Crafter \u003c61487138+theCosmicCrafter@users.noreply.github.com>", "phase": "P4"}, {"id": "sfind-4f2b5f7af379432b8ee2e59e959197e5", "sev": "low", "title": "AppBar docking ignores SHAppBarMessage results and re-parses the edge string three times", "cat": "swallowed-error", "files": ["src-tauri/src/window_commands.rs:248-298", "src-tauri/src/window_commands.rs:51-71"], "pr": "", "rem": "", "desc": "##### Overview `dock_appbar_win32` discards the return values of `SHAppBarMessage(ABM_NEW/ABM_SETPOS)` and returns `Ok(())` even if registration failed. The frontend then marks the window as docked. The edge string is also matched three separate times, with an `unreachable!()` holding the copies together. The `unsafe` blocks have no SAFETY comment, which the matcher notes say this repo expects. ##### Maintainability Cost ``` edge parsing: compute_snap_position (58-70), abe match (248-254), rect match (270-296, `_ => unreachable!()`) SHAppBarMessage(ABM_NEW, ..) // returns FALSE on failure, ignored -> Ok(()) -> setAppBarDocked(true) ``` Adding an edge or changing the rect logic means editing three matches in step. A failed registration shows as \"docked\" in the UI while no screen space is reserved. ##### Expected Impact - An `AppBarEdge` enum parsed once removes the `unreachable!()` coupling. - Checking the ABM_NEW result makes dock failures reach the UI. - Assumption: windows-sys returns the documented UINT_PTR (0 = failure for ABM_NEW).", "rec": "Parse `edge` once into an enum (or a (ABE_*, rect-builder) tuple) and use it in both functions. Check `SHAppBarMessage(ABM_NEW, ..) == 0` and return Err. Add `// SAFETY:` comments. Successful docks behave the same; only failed registrations change, and they now return an error. Note: Overlaps with sfind-e2309f67005e465181b27fa3a1bc3c3e on edge-string re-parsing; fix together. Code owners: Cosmic Crafter \u003c61487138+theCosmicCrafter@users.noreply.github.com>", "phase": "P4"}, {"id": "sfind-b8131dd90c064f3791f71d1be06e6e43", "sev": "low", "title": "Hand-rolled __TAURI_INTERNALS__ cast and raw invoke duplicate the existing Tauri-detection helper", "cat": "missing-abstraction", "files": ["src/components/ErrorBoundary.tsx:44-56", "src/lib/browserFallback.ts:115-118"], "pr": "", "rem": "", "desc": "##### Overview ErrorBoundary casts `globalThis` to reach `__TAURI_INTERNALS__.invoke` directly. The repo already has `isTauriAvailable()` (lib/browserFallback.ts:117) and a typed IPC layer in lib/tauri.ts. The same detection is re-implemented with three different cast shapes across the frontend. ##### Maintainability Cost ``` ErrorBoundary.tsx:47 (globalThis as Record\u003cstring, unknown>).__TAURI_INTERNALS__ as {invoke?} WindowControls.tsx:45 (globalThis as unknown as { __TAURI_INTERNALS__?: unknown }) useKeyboardShortcuts.ts:332 (globalThis as unknown as { __TAURI_INTERNALS__?: unknown }) AppLayout.tsx:276 (globalThis as Record\u003cstring, unknown>).__TAURI_INTERNALS__ browserFallback.ts:117 isTauriAvailable() \u003c- the helper ``` Each copy makes its own guess about the internals shape. If Tauri changes them, every file has to be fixed separately. ##### Expected Impact - One typed helper (for example `getLogPath()` in lib/tauri.ts guarded by `isTauriAvailable`) replaces the casts. - Assumption: there was no deliberate reason to avoid importing lib/tauri in the crash path; none is documented.", "rec": "Add `getLogPath(): Promise\u003cstring | null>` to lib/tauri.ts, guarded by `isTauriAvailable()`, and call it here. Use `isTauriAvailable()` in WindowControls and useKeyboardShortcuts too. The checks are equivalent (presence of `__TAURI_INTERNALS__`). Note: Member of root-cause group sfind-ed3a65ca42054b25813662fe220776f4 (use src/lib/tauri.ts adapter). Code owners: Cosmic Crafter \u003c61487138+theCosmicCrafter@users.noreply.github.com>", "phase": "P4"}, {"id": "sfind-ad5853fd75be489fbaad5a2c03f8ae62", "sev": "low", "title": "LUTPanel calls invoke(\"prepare_custom_lut\") directly with an `as string` cast instead of going through the src/lib/tauri.ts adapter", "cat": "convention-violation", "files": ["src/components/LUTPanel/index.tsx:34-40", "src/lib/tauri.ts:570-586"], "pr": "", "rem": "", "desc": "##### Overview The frontend's IPC surface is centralized in `src/lib/tauri.ts`, which holds typed wrappers for every other command (exportVideo, removeExportTemp, snapToEdge, ...). LUTPanel hard-codes the command name and casts the result. A rename or signature change in `commands::prepare_custom_lut` is therefore invisible to anyone auditing the adapter. ##### Maintainability Cost ``` LUTPanel.tsx:37 (await invoke(\"prepare_custom_lut\", { path })) as string src/lib/tauri.ts: export async function removeExportTemp(path) { return invoke(\"remove_export_temp\", { path }) } // the convention ``` This is the only `invoke` of this command, and it is outside the adapter. Searching tauri.ts for the full command list misses it. ##### Expected Impact - All IPC command names and result types live in one module. - Assumes tauri.ts is the intended single IPC surface (its breadth and the matcher note indicate so).", "rec": "Add `export async function prepareCustomLut(path: string): Promise\u003cstring> { return invoke\u003cstring>(\"prepare_custom_lut\", { path }); }` to src/lib/tauri.ts and call it from LUTPanel. It makes the same IPC call with the same result. Note: Member of root-cause group sfind-ed3a65ca42054b25813662fe220776f4 (use src/lib/tauri.ts adapter). Code owners: Cosmic Crafter \u003c61487138+theCosmicCrafter@users.noreply.github.com>", "phase": "P4"}, {"id": "sfind-1b07bec9831e4b0a905fc22b6c6db7a6", "sev": "low", "title": "Project save/open call raw invoke(\"save_file\"/\"read_file\") instead of the src/lib/tauri.ts adapter", "cat": "convention-violation", "files": ["src/hooks/useProject.ts:104-104", "src/hooks/useProject.ts:81-83", "src/lib/tauri.ts:644-653"], "pr": "", "rem": "", "desc": "##### Overview `src/lib/tauri.ts` is the IPC adapter. Every other command gets a typed wrapper there with an `isTauriAvailable()` guard (e.g. `savePresetsFile`, `loadPresetsFile`). useProject calls `invoke(\"save_file\")` and `invoke\u003cstring>(\"read_file\")` directly. These are the only two raw invokes of these commands in non-test frontend code. ##### Maintainability Cost ``` src/lib/tauri.ts savePresetsFile -> isTauriAvailable() guard + invoke(\"save_presets\") src/hooks/useProject invoke(\"save_file\", {path, contents}) // no guard, name and arg shape duplicated ``` The command names and argument shapes live outside the adapter. A rename on the Rust side, or a browser-fallback change, has to be found by grepping, and the browser-fallback path fails with a raw IPC error instead of the adapter's handling. ##### Expected Impact - All command names and argument shapes stay in one module. - Project save/open picks up the same non-Tauri handling as other file IO. - Low traffic: a single hook with two call sites.", "rec": "Add `saveTextFile(path, contents)` and `readTextFile(path)` wrappers to src/lib/tauri.ts that call the same commands with the same arguments, and call them from useProject. Under Tauri the behaviour is identical. Note: Member of root-cause group sfind-ed3a65ca42054b25813662fe220776f4 (use src/lib/tauri.ts adapter). Code owners: Cosmic Crafter \u003c61487138+theCosmicCrafter@users.noreply.github.com>", "phase": "P4"}, {"id": "sfind-e2309f67005e465181b27fa3a1bc3c3e", "sev": "low", "title": "Window commands use stringly errors and re-derive edge/window lookup in each command", "cat": "duplicated-logic", "files": ["src-tauri/src/window_commands.rs:24-29", "src-tauri/src/window_commands.rs:248-296"], "pr": "", "rem": "", "desc": "##### Overview All window commands return `Result\u003c_, String>` even though the crate has `AppError`. The same window/monitor lookup chain is repeated in each command, and the edge string is matched three times. The AppBar match ends in `unreachable!()`, which is only safe because an earlier match on the same string already returned an error for unknown values. ##### Maintainability Cost ``` get_webview_window(\"main\").ok_or(..) + current_monitor()...ok_or(..) -> L25-29, L77-81, L239-245, L319 match edge {left|right|top|bottom} -> L58-70, L248-254, L270-296 (_ => unreachable!()) ``` The `unreachable!()` depends on a separate match earlier in the function. If someone adds a new edge to one match and not the other, the app panics inside an `unsafe` block. The module is small and rarely changed (3 commits), so the overall cost is low. ##### Expected Impact - An `Edge` enum parsed once removes the `unreachable!()` panic path and the repeated string matches. - A shared `main_window_and_monitor(app)` helper removes four copies of the lookup chain. - The frontend wrappers in `src/lib/tauri.ts` only await these calls, so changing the error type does not affect them.", "rec": "Parse `edge` into an `enum Edge` (TryFrom\u003c&str>) at the top of each command and match on it exhaustively in `compute_snap_position` and `dock_appbar_win32`. Extract the window and monitor lookup into a helper. Accepted inputs and outputs stay the same. Code owners: Cosmic Crafter \u003c61487138+theCosmicCrafter@users.noreply.github.com>", "phase": "P4"}, {"id": "sfind-1d368696ac834bee9bfea662af31377e", "sev": "low", "title": "toggleFullscreen re-implements isTauriAvailable with a cast and drops errors", "cat": "missing-abstraction", "files": ["src/hooks/useKeyboardShortcuts.ts:325-344", "src/lib/browserFallback.ts:115-121"], "pr": "", "rem": "", "desc": "##### Overview `toggleFullscreen` checks for Tauri inline with `(globalThis as unknown as { __TAURI_INTERNALS__?: unknown })`. `isTauriAvailable()` in `src/lib/browserFallback.ts` already does this check and is used elsewhere (usePresets). The function is invoked with `void`, so a rejected `isFullscreen`/`setFullscreen` becomes an unhandled rejection and is never logged. ##### Maintainability Cost ``` useKeyboardShortcuts.ts L330-333 (globalThis as unknown as {...}).__TAURI_INTERNALS__ WindowControls.tsx L45 same cast ErrorBoundary.tsx L47 / AppLayout.tsx L276 other variants browserFallback.ts L115 isTauriAvailable() helper ``` There are four hand-written versions of the same environment check. Each new one is another place to update if the Tauri detection changes. ##### Expected Impact - Uses the shared helper and removes the type cast. - Fullscreen failures get logged through logger.warn.", "rec": "Replace the inline check with `if (!isTauriAvailable()) return;`. Wrap the `isFullscreen`/`setFullscreen` calls in try/catch and call `logger.warn(\"shortcuts\", ...)` on failure. Successful runs behave the same. Note: Member of root-cause group sfind-ed3a65ca42054b25813662fe220776f4 (use src/lib/tauri.ts adapter). Code owners: Cosmic Crafter \u003c61487138+theCosmicCrafter@users.noreply.github.com>", "phase": "P4"}, {"id": "sfind-59b59bc7aef34c13915d21dc52a6d882", "sev": "high", "title": "Export-cancel error built three ways, and the kill/wait/join child-cleanup sequence is copy-pasted 7 times", "cat": "duplicated-logic", "files": ["src-tauri/src/ffmpeg/mod.rs:1442-1453", "src-tauri/src/ffmpeg/mod.rs:1518-1541", "src-tauri/src/ffmpeg/mod.rs:1678-1703", "src-tauri/src/ffmpeg/mod.rs:210-213"], "pr": "", "rem": "", "desc": "##### Overview The module defines `EXPORT_CANCELLED` as \"the error every NEW cancel site returns\". The cancel path in the encode loop still hard-codes the string literal and wraps it in `AppError::Ffmpeg`. The decode path wraps the constant in `AppError::Generic`. So the same event produces different error kinds and different Display text: \"FFmpeg error: Export cancelled by user\" vs \"Export cancelled by user\". Separately, every timeout, cancel or error branch repeats the same child cleanup by hand (`child.kill()`, `wait_timeout(10s)`, join the stderr/stdout readers) and drops every result with `let _`. The copies have already drifted: the `Err(e)` arms skip the bounded `wait_timeout`, and only some branches flush stdin first. ##### Maintainability Cost ``` line 1452 AppError::Ffmpeg(\"Export cancelled by user\") // literal, Ffmpeg variant line 1621 AppError::Generic(EXPORT_CANCELLED.to_string()) // constant, Generic variant line 1685 AppError::Generic(EXPORT_CANCELLED.to_string()) kill+wait+join copies: 1447, 1469, 1524, 1535, 1682, 1689, 1699 (1535/1699 omit wait_timeout) ``` This is the export pipeline, the module with the most churn in the backend (about 32 commits). Tests match cancellation with `contains(\"cancelled\")` (mod.rs:2828, commands.rs:4315), so changing either the literal or the constant can quietly break the other path. Each new cancel or timeout branch has to re-derive the cleanup ritual, and the existing copies do not agree on whether to reap the child before joining the readers. ##### Expected Impact - One cancel error (constant + one variant) means renaming the message or adding a typed `Cancelled` variant is a single edit. - A `kill_and_reap(child, readers)` helper makes every abort path reap the child with the same bounded wait. New branches can't forget a step. - Assumes the frontend branches on the store cancel flag rather than the error text, as the comment at line 211 states.", "rec": "Use `EXPORT_CANCELLED` at line 1452 and pick one variant for all three cancel sites. Better still, add a `cancelled()` constructor or an `AppError::Cancelled` variant whose Display matches the current text. Extract `fn abort_child(child: &mut Child, readers: impl IntoIterator\u003cItem = JoinHandle\u003c()>>)` that kills, waits up to 10 s, logs a kill failure at debug level, and joins the readers, then call it from each branch. Message text and control flow stay the same. The only change is that the Err(e) arms also reap with a bounded wait.", "phase": "P5"}, {"id": "sfind-7fcb4ed614a94f78af026f5ee6a3b80e", "sev": "high", "title": "Identical per-frame process_video loop copy-pasted into ~60 effects because the Effect trait has no default", "cat": "missing-abstraction", "files": ["src-tauri/src/effects/analog/chromatic_aberration.rs:85-99", "src-tauri/src/effects/analog/hue_shift.rs:71-84", "src-tauri/src/effects/artistic/posterize.rs:72-86", "src-tauri/src/effects/types.rs:97-111"], "pr": "", "rem": "", "desc": "##### Overview `Effect::process_video` is a required trait method with no default. So every non-temporal effect re-implements the same eight lines: allocate a Vec, call `process_frame` for each frame, and rebuild the VideoSegment with the same fps. Adding a default implementation to the trait would delete roughly 60 copies and make the temporal effects, which actually override it, stand out. ##### Maintainability Cost ``` grep 'frames.push(self.process_frame(frame, mask, params)?)' -> 60 files grep 'fn process_video' -> 80 files ``` Every new effect author has to copy this loop. Any change to how a segment is processed per frame (passing frame time, honoring cancel, parallelism) has to be made in 60 places. Effects whose `process_video` actually differs (combine, iframe_removal, beat_sync) are hidden among identical copies. Today the copies are identical: the cost is volume and future drift, not an existing bug. ##### Expected Impact - About 500 lines of boilerplate removed across the effects tree. - New effects only implement `process_frame` unless they are temporal. - Temporal overrides become the visible exception.", "rec": "Give `process_video` a default body in the Effect trait that maps `process_frame` over `input.frames` and keeps `fps`. Then delete the identical overrides. Behavior is unchanged because the default is byte-for-byte the code being removed.", "phase": "P5"}, {"id": "sfind-1ce70188c6374f46a53c0bf546b9e691", "sev": "medium", "title": "\"export-progress\" event emitted from 10 sites with ad-hoc JSON payloads and duplicated percentage math", "cat": "magic-values", "files": ["src-tauri/src/commands.rs:1385-1393", "src-tauri/src/commands.rs:1470-1471", "src-tauri/src/commands.rs:1475-1478"], "pr": "", "rem": "", "desc": "##### Overview Export progress is emitted with the string literal `\"export-progress\"` and an inline `serde_json::json!` payload at 10 sites. The payload shape varies from site to site: some include `total/current`, one includes `warning`, others only `stage/progress`. The progress formula `5 + (idx+1)/len*80` is copied twice. A typed payload and a single emit helper would make the contract with the frontend explicit. ##### Maintainability Cost ``` commands.rs: 10x app_handle.emit(\"export-progress\", json!({...})) src/components/ExportPanel/index.tsx:235 listen(\"export-progress\") -- only consumer ``` Nothing checks the frontend/backend contract. A renamed key or a typo in the event name compiles fine and silently breaks the progress bar. The percentage bands (5..85, 90) are magic numbers spread across the function, so changing the stage weighting means finding every literal. ##### Expected Impact - One `ExportProgress` struct makes the payload schema discoverable and type-checked. - Stage percentages live as named constants in one place.", "rec": "Define a `#[derive(Serialize)] struct ExportProgress { stage, progress, total: Option, current: Option, warning: Option }` with `skip_serializing_if`, a `const EXPORT_PROGRESS_EVENT`, and a `fn effect_progress_pct(idx, len)`. Route all 10 sites through one `emit_progress` helper. The serialized JSON stays identical. Code owners: Cosmic Crafter \u003c61487138+theCosmicCrafter@users.noreply.github.com>", "phase": "P5"}, {"id": "sfind-14a6209d306647b0b06a26c05bee42ac", "sev": "medium", "title": "Bridge failures surface as AppError::Generic, so the restart logic substring-matches error text", "cat": "inconsistent-error-handling", "files": ["src-tauri/src/commands.rs:1650-1670", "src-tauri/src/error.rs:4-28", "src-tauri/src/sam3_engine.rs:625-634"], "pr": "", "rem": "", "desc": "##### Overview `Sam3Engine` reports bridge-side failures, spawn failures, missing pipes and failed kills as `AppError::Generic(String)`. Pipe I/O errors are `AppError::Io`. The caller in commands.rs decides whether to auto-restart the engine by calling `e.to_string()` and checking for `\"pipe\"`, `\"closed\"` or `\"os error\"`. Restart behavior therefore depends on wording, and the wording comes from Python messages, OS messages and this file's format strings. ##### Maintainability Cost ``` sam3_engine.rs: Err(AppError::Generic(resp.message)) x9 (Python text) commands.rs:1655 if err_str.contains(\"pipe\") || err_str.contains(\"closed\") || err_str.contains(\"os error\") => restart ``` A Python error that happens to mention \"closed\" (for example a mask message) triggers a full engine restart, which reloads a model of several GB. Rewording an `Io` message or running on a localized OS can stop a real broken-pipe from triggering one. The crate already uses typed variants (`Sam3Timeout`, `Io`, `Ffmpeg`), so this is the one SAM3 path that loses the error kind. Reading the code gives no way to tell which errors trigger a restart. ##### Expected Impact - Restart is decided by matching on the variant (`AppError::Io(_)` or a new `Sam3BridgeDied`), not on text. - Bridge-reported command failures (`Sam3Command(String)`) stay distinct from transport failures, and the user-facing text does not change. - Assumption: no frontend code parses these strings. The commands return `String` via `to_string()`, which typed variants keep unchanged.", "rec": "Add `Sam3Command(String)` for bridge-reported failures and `Sam3Bridge(String)` for spawn, missing-pipe and kill failures, with the same `#[error(\"{0}\")]` display. In commands.rs, replace the substring check with `matches!(e, AppError::Io(_) | AppError::Sam3Bridge(_))`. Displayed messages stay identical. Note: Member of root-cause group sfind-830d658755034205ad89539684612e3f (typed, serializable error codes instead of message matching). Code owners: Cosmic Crafter \u003c61487138+theCosmicCrafter@users.noreply.github.com>", "phase": "P5"}, {"id": "sfind-abf428bd90d540cfbc0eb365fd857679", "sev": "medium", "title": "Every SAM3 command hand-builds a 17-field Sam3Request literal and repeats the status check", "cat": "duplicated-logic", "files": ["src-tauri/src/sam3_engine.rs:14-50", "src-tauri/src/sam3_engine.rs:636-731", "src-tauri/src/sam3_engine.rs:733-765"], "pr": "", "rem": "", "desc": "##### Overview There are 11 SAM3 commands (`load_image`, `text_prompt`, `point_prompt`, `box_prompt`, `auto_mask`, `video_predictor`, `refine_mask`, `postprocess_mask`, `clear`, `shutdown`, plus `new`'s handshake). Each one spells out every field of `Sam3Request`, almost all set to `None`. Each one then repeats the same `if resp.status == \"ok\" { … } else { Err(Generic(resp.message)) }` tail, and four of them repeat the same mask/score zip loop. Deriving `Default` and adding one response helper would cut about 250 lines and make adding a field or command a one-line change. ##### Maintainability Cost ``` Sam3Request { cmd, auth_token, image_b64, prompt, points, labels, boxes, index, grid_size, iou_threshold, min_mask_region_area, mask_b64, grow, shrink, feather, fill_holes, frames } x11 literals mask/score zip: text_prompt, point_prompt, box_prompt, refine_mask (loop) vs auto_mask (into_iter().zip) ``` Adding one bridge parameter means editing all 11 literals. The result-extraction code has also split into two styles (an indexed clone loop vs `into_iter().zip`) for the same `Vec\u003c(String, f64)>`. The Python bridge protocol changes whenever a SAM3 feature is added, so this file is edited often. ##### Expected Impact - Each command becomes `self.send(Sam3Request { cmd: \"box_prompt\".into(), boxes: Some(boxes), ..Default::default() })` followed by one helper call. - A new request field needs one edit instead of eleven. - One way of extracting mask results instead of two.", "rec": "Add `#[derive(Default)]` to Sam3Request and use struct-update syntax `..Default::default()` at each call site. Add `fn ok_or_err(resp: Sam3Response) -> Result\u003cSam3Response>` and `fn masks_with_scores(resp) -> Vec\u003c(String,f64)>`, and use them everywhere. Serialization is unchanged because every omitted field is still `None` and is skipped by `skip_serializing_if`. Code owners: Cosmic Crafter \u003c61487138+theCosmicCrafter@users.noreply.github.com>", "phase": "P5"}, {"id": "sfind-d8befd0fb2764675aaca02dde5582be4", "sev": "medium", "title": "Horizontal and vertical run-sort are ~60-line copies kept in sync by comment, and have already drifted once", "cat": "duplicated-logic", "files": ["src-tauri/src/effects/glitch/sorting_glitch.rs:10-23", "src-tauri/src/effects/glitch/sorting_glitch.rs:211-277", "src-tauri/src/effects/glitch/sorting_glitch.rs:278-337"], "pr": "", "rem": "", "desc": "##### Overview `process_frame` contains two nearly identical blocks: find the run, collect pixels, partial-sort by `intensity`, write back. The only differences are the axis and the index formula. The vertical copy's own comment says it was changed \"so Vertical isn't the only direction where intensity is unreachable\", which means the copies had diverged before. A single `sort_runs(line_len, index_of)` helper would remove the duplication and the 6–8 level nesting the signal flagged. ##### Maintainability Cost ``` lines 213-277 (rows) \u003c-> lines 280-336 (columns) diffs: idx = (row_start+x)*4 vs (y*w+x)*4 ; everything else identical ``` This file has been churned repeatedly (intensity fix, Select default fix, auto-threshold). Each change has to be made twice, and the comments track whether the two copies match. ##### Expected Impact - Future changes to the sort logic are made once. - Nesting drops from about 8 levels to about 4. - The unused `_direction` struct field (set in `new`, never read) can go at the same time.", "rec": "Extract `fn sort_runs(data: &mut [u8], line_len: usize, pixel_index: impl Fn(usize) -> usize, threshold, intensity, sort_key)`. Call it once per row with `|x| (y*w+x)*4` and once per column with `|y| (y*w+x)*4`. It runs the same arithmetic in the same order, so the output is byte-identical. Remove the `_direction` field. Code owners: Cosmic Crafter \u003c61487138+theCosmicCrafter@users.noreply.github.com>", "phase": "P5"}, {"id": "sfind-6fd7d570aacd48008e7aa8adad61f6e2", "sev": "medium", "title": "Image/inference state held in seven module globals; OOM+autocast handling copy-pasted per command", "cat": "other-global-state", "files": ["src-tauri/sam3_bridge.py:1029-1037", "src-tauri/sam3_bridge.py:222-243", "src-tauri/sam3_bridge.py:566-646", "src-tauri/sam3_bridge.py:656-670"], "pr": "", "rem": "", "desc": "##### Overview The SAM3 sidecar keeps the session in module globals (`model`, `processor`, `model_manager`, `current_image`, `orig_hw`, `inference_state`, `scale_x`, `scale_y`), and each `cmd_*` function mutates them through `global`. The file's own comments record two bugs this design has already caused. On top of that, the AMP-autocast wrapper and the CUDA-OOM handler are pasted into six commands and have already drifted. ##### Maintainability Cost ``` bug 1 (comment L238-242): inference_state not initialised -> NameError instead of \"no image\" bug 2 (comment L566-584): globals updated one by one -> state describing two different images, wrong mask reported as ok autocast block: L603, 659, 704, 762, 818, 1014 OOM handler: L626 wraps empty_cache in try/except and checks isinstance; L665/720/778/832/1033 do not ``` The fix for bug 2 is a 20-line comment plus a local-then-commit discipline, and every future command has to remember to follow it. A small session object with an atomic `replace()` would enforce that structurally. The duplicated OOM handlers have diverged: only `cmd_load_image` protects `torch.cuda.empty_cache()` against raising. Every copy says \"CUDA out of memory\" even when the device is the CPU. The file has 12 commits in its history and is the only bridge between Rust and SAM3. ##### Expected Impact - State consistency is enforced by one object instead of by comments. - Handlers can be unit-tested without module-level setup. - One `_infer(fn, label)` helper removes the six copies of autocast plus OOM and their drift.", "rec": "Introduce a `Sam3Session` dataclass (image, orig_hw, scale, inference_state) with `replace(...)` and `clear()`, held by a single module-level instance or passed to handlers. Extract `_run_inference(label, fn)`, which applies the AMP autocast when `DEVICE == 'cuda' and USE_AMP`, catches RuntimeError OOM, calls a guarded empty_cache, and returns the error dict. Response payloads stay the same. Code owners: Cosmic Crafter \u003c61487138+theCosmicCrafter@users.noreply.github.com>", "phase": "P5"}, {"id": "sfind-5c030cf615f14ed68f73b7089a28a4dd", "sev": "medium", "title": "No-audio detection depends on substring-matching a Rust error message built in two places", "cat": "other-implicit-coupling", "files": ["src-tauri/src/commands.rs:1566-1570", "src-tauri/src/ffmpeg/mod.rs:1991-2001", "src/hooks/useAutoAudioExtract.ts:126-135"], "pr": "", "rem": "", "desc": "##### Overview The hook tells \"video has no audio track\" apart from a real extraction failure with `msg.includes(\"no audio stream\")`. That text is a literal built in two separate Rust places: the `has_audio_stream` fast path in commands.rs and the ffmpeg stderr sniffing in `extract_audio_to_wav`. Both get flattened to `String` at the IPC boundary. If either Rust message is reworded, a silent video shows \"Audio auto-extract failed\" instead of the no-audio hint, and the compiler does not catch it. ##### Maintainability Cost ``` commands.rs:1569 Err(\"Source video has no audio stream\") ffmpeg/mod.rs:1999 AppError::Ffmpeg(\"Source video has no audio stream\") useAutoAudioExtract:128 if (msg.includes(\"no audio stream\")) \u003c- contract lives only in the string ``` Three files in two languages share an implicit contract, and nothing names it. The hook runs on every video load. ##### Expected Impact - No-audio becomes a typed result, for example `extractAudioFromVideo` returning `null` or `{ hasAudio: false }`, or a shared error-code constant. Rewording a message can then no longer change UI behavior. - The duplicated Rust literal collapses to one source.", "rec": "Have `extract_audio_from_video` return `Option\u003cString>` (None when there is no audio stream) and have the ffmpeg path return a typed variant that commands.rs maps to None. In the hook, branch on `null` instead of the message text. The visible behavior is identical for both outcomes. Note: Member of root-cause group sfind-830d658755034205ad89539684612e3f (typed, serializable error codes instead of message matching). Code owners: Cosmic Crafter \u003c61487138+theCosmicCrafter@users.noreply.github.com>", "phase": "P5"}, {"id": "sfind-98b1ba2c484747a7a047cae03033ee64", "sev": "medium", "title": "chunk_size read via as_u64 ignores clamped/float values", "cat": "inconsistent-error-handling", "files": ["src-tauri/src/effects/glitch/byte_reverse.rs:50-58", "src-tauri/src/effects/params.rs:130-134"], "pr": "", "rem": "", "desc": "##### Overview `ByteReverse` reads `chunk_size` with `as_u64()`. When `clamp_params` clamps the value to its declared range (2–64), it writes back a float, so this read returns `None` and the effect falls back to `self.chunk_size`. This is the same bug that line_screen.rs documents and fixes. ##### Maintainability Cost ``` chunk_size=100 -> clamp -> 64.0 (float) -> as_u64() None -> 8 chunk_size=1 -> clamp -> 2.0 (float) -> as_u64() None -> 8 ``` Any out-of-range value, or a float from a wheel drag, gives an unrelated default instead of the nearest valid size. Nothing is logged, so the user only sees a slider that has no effect at its extremes. The read also passes the value straight to `chunks_exact_mut`, which panics on 0. That path is only safe because the clamp happens to run first. ##### Expected Impact - The slider ends do what they say. - Using the shared helper and a local `.max(2)` makes the `chunks_exact_mut` invariant hold locally, without depending on the clamp.", "rec": "Read with the same f64-round-clamp pattern line_screen.rs uses (or the shared helper proposed for profiles.rs) and clamp to 2..=64 locally. Integer inputs give the same result; clamped and float inputs now land on the nearest valid size. Note: Member of root-cause group sfind-8c66c7b00a8f439690ac7b4a53ed3435 (shared integer param extraction helper). Code owners: Cosmic Crafter \u003c61487138+theCosmicCrafter@users.noreply.github.com>", "phase": "P5"}, {"id": "sfind-fc27e7997beb47bc80e3874bbd97b39b", "sev": "medium", "title": "direction=\"both\" discards the horizontal shift because the vertical pass overwrites the same pixel from the unshifted input", "cat": "other-dead-option-branch", "files":
