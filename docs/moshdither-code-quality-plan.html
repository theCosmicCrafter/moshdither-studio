["src-tauri/src/effects/pixel_geo/slice_shift_advanced.rs:149-165", "src-tauri/src/effects/pixel_geo/slice_shift_advanced.rs:65-78"], "pr": "", "rem": "", "desc": "##### Overview The two `if direction == ...` blocks inside the pixel loop both write `data[dst]` from `input.data`. With `both`, the vertical block runs second and overwrites what the horizontal block just wrote, so `both` produces exactly the same output as `vertical`. The string-compared, inline branching hides this. ##### Maintainability Cost ``` horizontal: data[dst] = input[row, x+shift] vertical: data[dst] = input[row+shift, x] // same dst, reads the original input -> horizontal result lost ``` The UI lists `both` as an option, but it behaves as `vertical`. Direction is matched as raw string literals (\"horizontal\" / \"vertical\" / \"both\") inside a 5-level loop, so the composition order is easy to miss. The single test only covers `horizontal`. ##### Expected Impact - `both` gives a real diagonal shift. - Parsing direction into an enum once makes the combined case explicit. - Assumption: `both` is meant to apply both shifts together.", "rec": "Parse direction into flags `(dx, dy)` once before the loop, then compute a single source index `src = ((row+dy*shift) mod h, (x+dx*shift) mod w)` and copy once. Horizontal and vertical behave exactly as before. `both` then composes the two shifts. This is a behaviour change for `both` only, and that is the fix. Code owners: Cosmic Crafter \u003c61487138+theCosmicCrafter@users.noreply.github.com>", "phase": "P5"}, {"id": "sfind-2cce20eef16646f0bf8fd2dfc0e39f49", "sev": "medium", "title": "ffgac encode / raw-split / concat pipeline copy-pasted across shuffle, rise, water_bloom, combine and drifting", "cat": "duplicated-logic", "files": ["packages/python-backend/DatamoshLib/FFG_effects/basic_modes.py:152-185", "packages/python-backend/DatamoshLib/FFG_effects/basic_modes.py:187-216", "packages/python-backend/DatamoshLib/FFG_effects/basic_modes.py:218-265", "packages/python-backend/DatamoshLib/FFG_effects/basic_modes.py:95-117"], "pr": "", "rem": "", "desc": "##### Overview `library()` contains four nested functions that each repeat the same steps: reset `cache_ffg`, encode with ffgac at qscale 6 and 30 fps, split into raw frames, reorder the frame list, concatenate into memory, write the output, and rmtree. `get_vectors` and `apply_vectors` duplicate the motion-vector encode command in the same way. The copies have already diverged. ##### Maintainability Cost ``` shuffle: open(output,'wb+'), rmtree unguarded rise: open(output,'wb'), rmtree unguarded, `qua=''` unused, po==0 -> 1 magic water_bloom: open(output,'wb'), rmtree unguarded, `qua=''` unused combine: adds \"-s 1920x1080\", cleanup wrapped in bare `except: pass` get_vectors/apply_vectors: identical 8-arg ffgac command twice ``` The mode is selected by an integer (`mode==1..7`) that mosh_cli.py maps from names, and the per-mode arguments use opaque single-letter names (`s`, `e`, `f`, `r`, `vh`). A change to the ffgac flags, such as the recent CREATE_NO_WINDOW and timeout work, has to be applied in six places. The `rmtree('cache_ffg')` at the start of each function is now redundant because `_scratch_dir()` already isolates every run, and the bare except that silences cleanup errors exists in only one copy. This is the live datamosh path called by mosh_cli.py, and it has 7 commits including a \"silently broken\" repair. ##### Expected Impact - An ffgac flag change is made once. - The redundant cache resets, the unused `qua` variables and the bare `except: pass` go away. - Named mode constants and named parameters replace the magic integers and single-letter arguments.", "rec": "Extract `_encode_raw_frames(src, dest_dir, extra_args=())`, which returns a sorted frame list, and `_concat_frames(paths, output)`. Each mode then only computes its frame ordering. Drop the pre-run `cache_ffg` rmtree and the final cleanup, which `_scratch_dir` already handles. Extract `_mv_encode(src)` for the two vector functions and replace `except:` with `except (KeyError, TypeError):`. Pass combine's `-s 1920x1080` as `extra_args` so outputs stay byte-identical. Code owners: Cosmic Crafter \u003c61487138+theCosmicCrafter@users.noreply.github.com>", "phase": "P5"}, {"id": "sfind-35e74ec9760d482d8a4110bf48aa3de9", "sev": "medium", "title": "mosh() fails silently on missing input, leaks a CWD temp dir on error, and ignores the pulse 'frame' parameter", "cat": "swallowed-error", "files": ["packages/python-backend/DatamoshLib/FFG_effects/basic_modes.py:21-45", "packages/python-backend/DatamoshLib/Tomato/tomato.py:175-188", "packages/python-backend/DatamoshLib/Tomato/tomato.py:22-32", "packages/python-backend/DatamoshLib/Tomato/tomato.py:238-243"], "pr": "", "rem": "", "desc": "##### Overview `tomato.mosh` is called by mosh_cli.py for eight user-facing modes. It returns `None` without any error when the input file is missing. It creates `temp-NNNNN` in the current working directory and only removes it on the success path. The `pulse` mode's counter `j` is incremented only in the `else` branch, which `j=0` never reaches, so every frame is repeated `pulselen` times and `pulseryt` (the UI's `frame` param) is never used. The sibling module basic_modes.py already fixed the CWD-temp problem with `_scratch_dir()`; tomato.py never got that fix. ##### Maintainability Cost ``` filein missing -> return -> mosh_cli then fails in ffmpeg on temp_corrupted (\"not found\"), wrong step blamed exception in steps 2-4 -> temp-NNNNN/ left in app CWD (no try/finally) pulse: j=0; if j%pulselen==0 -> always true, j never increments -> pulseryt unused exponential/swap: print \"using void\" but leave final=[] -> empty movi ``` The silent return is the failure mode that basic_modes.py's `_run` docstring calls out (\"died later at an unrelated 'file not found', pointing at the wrong step\"). The 6–8 level nesting in `bstream_until_marker`, together with a frame-index loop whose comment indentation does not match its code (lines 88–95, including a sort inside the per-chunk loop), makes these defects hard to see. ##### Expected Impact - A missing input raises at the point of failure, which mosh_cli's error handler turns into a readable message. - No temp directories are left in the CWD. - The pulse counter bug and the unused param become visible and can be fixed. Fixing pulse changes output, so that needs a product decision.", "rec": "Raise `FileNotFoundError` instead of returning. Create the temp dir with `tempfile.mkdtemp()` and wrap steps 1–4 in `try/finally: shutil.rmtree(...)`. Flatten `bstream_until_marker` with early `continue`/`return`. These keep successful output identical. Separately, flag the pulse counter and the exponential/swap empty output to the product owner, because fixing them changes rendered results. Code owners: Cosmic Crafter \u003c61487138+theCosmicCrafter@users.noreply.github.com>", "phase": "P5"}, {"id": "sfind-d9831b51fb9f4e49904143716c83fc30", "sev": "medium", "title": "run_cancellable repeats kill/wait/comment block 3x and duplicates ffmpeg::output_with_timeout_cancellable", "cat": "duplicated-logic", "files": ["src-tauri/src/commands.rs:2878-2914", "src-tauri/src/ffmpeg/mod.rs:1609-1700"], "pr": "", "rem": "", "desc": "##### Overview The cancel, timeout and wait-error exits in `run_cancellable` each repeat `child.kill(); child.wait_timeout(10s)` and an identical five-line comment about not joining reader threads. The wait-error copy skips the `wait_timeout`, so it has already drifted. ffmpeg/mod.rs separately implements the same spawn, reader-thread, poll, kill and timeout loop (`output_with_timeout_cancellable`). The commands.rs copy uses KillJob; the ffmpeg copy has to be checked separately for the same protection. ##### Maintainability Cost ``` commands.rs:2882/2892/2905 kill + (wait_timeout) + identical 5-line comment ffmpeg/mod.rs:1609 output_with_timeout_cancellable -- same poll/kill/timeout loop ``` The tree-kill behavior relies on subtle details (KillJob, dropping the job only after an early return, never joining the readers first). Those details are documented in one copy only. The next fix to the subprocess lifecycle has to be found and applied in two runners and three exit paths. ##### Expected Impact - One `abort_child(&mut child)` helper and one comment. - One shared cancellable runner (in proc.rs, per the repo convention that all spawns go through `crate::proc`), so the KillJob semantics apply everywhere.", "rec": "Extract `fn abort_child(child: &mut Child)` with the comment written once, and call it from all three exits. Then move one cancellable `run_with_cancel(cmd, cancel, timeout, poll)` into proc.rs and use it from both commands.rs and ffmpeg/mod.rs. Return values and error strings stay the same. Note: Member of root-cause group sfind-59b59bc7aef34c13915d21dc52a6d882 (shared child teardown helper). Code owners: Cosmic Crafter \u003c61487138+theCosmicCrafter@users.noreply.github.com>", "phase": "P5"}, {"id": "sfind-05199d9f9c6a4d778b36e6d1fa4763ad", "sev": "medium", "title": "sam3_shutdown discards the shutdown error and always reports success", "cat": "swallowed-error", "files": ["src-tauri/src/commands.rs:1836-1844", "src-tauri/src/sam3_engine.rs:905-962"], "pr": "", "rem": "", "desc": "##### Overview `Sam3Engine::shutdown()` returns a `Result` specifically so that callers can surface a failed kill or reap. Its helper is documented as \"Returns any terminal error so callers can report it to the UI/logs\". The `sam3_shutdown` IPC command drops that result with `let _` and returns `Ok(\"SAM3 engine shut down\")` regardless. ##### Maintainability Cost ``` kill_child(): wait_timeout Err -> AppError::Generic(\"SAM3 bridge shutdown failed\") shutdown() -> result sam3_shutdown(): let _ = engine.shutdown(); Ok(\"SAM3 engine shut down\") ``` When the Python bridge fails to exit (the orphaned-process scenario that KillJob and remove_sam3_pid were built for), the UI is told it succeeded, and the error exists only as a tracing log. The callee's contract and the caller disagree, so the next maintainer cannot tell which one is intended. ##### Expected Impact - The UI learns when the bridge did not shut down cleanly. - The callee's documented contract is honoured. - lib.rs:93 (window close) can keep a best-effort discard, but should log it.", "rec": "Use `engine.shutdown().map_err(|e| e.to_string())?;` (as `sam3_clear` already does two functions above). The engine is still taken out of state before the call, so the state result is unchanged; only the reported outcome becomes accurate. Code owners: Cosmic Crafter \u003c61487138+theCosmicCrafter@users.noreply.github.com>", "phase": "P5"}, {"id": "sfind-c5b3235b11da49b78c9a36e48248b02c", "sev": "low", "title": "BPM detection failure silently becomes null, and the live export path is labelled \"Legacy compatibility\"", "cat": "swallowed-error", "files": ["src/engine/audio/AudioFeatureExtractor.ts:286-293", "src/engine/audio/AudioFeatureExtractor.ts:467-473", "src/hooks/useAudioEngine.ts:250-257"], "pr": "", "rem": "", "desc": "##### Overview In `extractManifest`, a `detectBpm` failure is caught and turned into `bpm = null` with no log. The manifest then reaches the store (`setAudioBpm(manifest.bpm)`) and looks exactly like a track with no detectable tempo. Separately, `manifestToBakeData` sits under a \"Legacy compatibility\" banner, yet it is the only path from the manifest to the Rust export pipeline (useAudioEngine.ts:255). That label invites someone to delete or bypass a load-bearing function. ##### Maintainability Cost ``` try { bpm = await detectBpm(buffer) } catch { bpm = null } // decoder bug == \"no tempo\" // ─── Legacy compatibility ─── manifestToBakeData() \u003c- useAudioEngine.ts:255 (sole export feed) ``` When beat-synced effects quietly stop working, nobody can tell a detector exception from a track with no beat. The \"legacy\" name says the opposite of what the code's role is. ##### Expected Impact - `logger.warn` on BPM failure lets support tell a detector failure from a beatless track. - Renaming the section (e.g. \"Export pipeline adapter\") prevents accidental removal. - Assumes no other export path consumes AudioManifest directly (grep found only useAudioEngine).", "rec": "Bind the error and call `logger.warn(\"AudioFeatureExtractor\", \"BPM detection failed\", { error: String(err) })` before setting `bpm = null`. The resulting value is unchanged. Retitle the section comment so it describes the function as the Rust export adapter. Code owners: Cosmic Crafter \u003c61487138+theCosmicCrafter@users.noreply.github.com>", "phase": "P5"}, {"id": "sfind-edb436814bc94b2790bf21bcd7ca1daa", "sev": "low", "title": "Black/white pixel write duplicated in three invert branches", "cat": "deep-nesting", "files": ["src-tauri/src/effects/dithering/line_screen.rs:166-200"], "pr": "", "rem": "", "desc": "##### Overview The inner pixel loop writes RGB=0 or RGB=255 through six hand-written branches across three nested if/else levels (line vs background vs below-threshold, each split again on `invert`). Every pixel is either ink or paper, and `invert` only swaps the two colours. ##### Maintainability Cost ``` if ink>threshold { if is_line { if invert {255} else {0} } else { if invert {0} else {255} } } else { if invert {0} else {255} } ``` Six branches are needed to express one boolean, `on = ink > threshold && is_line`, followed by `value = if on ^ invert { 0 } else { 255 }`. This file has had tone-mapping bug fixes before (see the comment about brightness versus darkness), and the repeated branches make the next tone change easy to apply in one branch and miss in another. ##### Expected Impact - The pixel loop shrinks by about 30 lines, and the ink and paper logic sits in one place.", "rec": "Compute `let ink_on = ink > threshold && is_line; let v = if ink_on != invert { 0 } else { 255 };` and write `data[idx..idx+3].fill(v)`. The truth table is the same as the current six branches. Code owners: Cosmic Crafter \u003c61487138+theCosmicCrafter@users.noreply.github.com>", "phase": "P5"}, {"id": "sfind-fbba81f5d92b4b5097d0c424b8b89243", "sev": "low", "title": "Dimension mismatches reported as AppError::Generic despite typed variants", "cat": "inconsistent-error-handling", "files": ["src-tauri/src/effects/engine.rs:18-33", "src-tauri/src/error.rs:4-28"], "pr": "", "rem": "", "desc": "##### Overview `blend_mask` returns `AppError::Generic` for both a frame/frame dimension mismatch and a malformed mask. `AppError` already has `InvalidParameter` and `Image` variants that describe these failures. ##### Maintainability Cost ``` blend_mask -> AppError::Generic(\"mask dimension mismatch...\") // kind lost error.rs: InvalidParameter(String), Image(String) exist ``` `Generic` displays as the bare message, so callers and the UI cannot tell bad input from an internal failure. There are 71 `Generic(` constructions across the crate, and this shared render-path helper adds to the habit. ##### Expected Impact - Callers can branch on the error kind. This is a small step toward retiring `Generic`.", "rec": "Use `AppError::InvalidParameter` for the mask-size mismatch and `AppError::Image` for the frame mismatch. The Result type is unchanged; only the Display prefix changes. Note: Member of root-cause group sfind-830d658755034205ad89539684612e3f (typed, serializable error codes instead of message matching). Code owners: Cosmic Crafter \u003c61487138+theCosmicCrafter@users.noreply.github.com>", "phase": "P5"}, {"id": "sfind-7923d6a5420e41b1b0328ac941f316c8", "sev": "low", "title": "Failed SAM3 PID-file write is silently dropped, disabling orphan reaping without a trace", "cat": "swallowed-error", "files": ["src-tauri/src/sam3_engine.rs:101-106", "src-tauri/src/sam3_engine.rs:85-91"], "pr": "", "rem": "", "desc": "##### Overview `write_sam3_pid` ignores the results of both `create_dir_all` and `fs::write`. The PID file is the only way `cleanup_stale_sam3_bridge` can find a multi-GB orphaned bridge after a crash. When the write fails, the safety net is off and nothing is logged. ##### Maintainability Cost ``` write_sam3_pid: let _ = create_dir_all; let _ = fs::write -> no log cleanup_stale_sam3_bridge: read_to_string Err -> return (assumes 'no stale process') ``` The rest of the module logs kill and wait failures with `tracing::warn!`/`error!` (for example kill_child at lines 971-990). This write path is the one exception, so a missing PID file cannot be told apart from \"no previous crash\" when debugging leftover 3.4 GB Python processes. ##### Expected Impact - A `tracing::warn!` on failure makes it diagnosable why orphan reaping did not run. - Assumption: the temp dir is normally writable, so this mainly affects unusual profiles.", "rec": "Replace `let _ =` with `if let Err(e) = ... { tracing::warn!(\"Could not record SAM3 bridge PID: {e}\") }`. Control flow is identical; only a log line is added. Code owners: Cosmic Crafter \u003c61487138+theCosmicCrafter@users.noreply.github.com>", "phase": "P5"}, {"id": "sfind-c4d6cc016c214f038d924991828ba221", "sev": "low", "title": "Fault handler comment promises no allocation, but the code formats several heap strings", "cat": "misleading-name", "files": ["src-tauri/src/crash.rs:222-290"], "pr": "", "rem": "", "desc": "##### Overview The comment on `on_fault` says it does \"no allocation-heavy formatting\". The body then builds `location`, `access_line`, the memory description and the final message with `format!`, and `module_of` allocates too. This handler runs after access violations, when the heap may be corrupted. ##### Maintainability Cost ``` comment: \"No allocation-heavy formatting\" vs body: 4x format!/String + sysmem::describe ``` A future maintainer reading the comment would assume the handler is safe to run after heap corruption, when it isn't. The file changes rarely, so the cost is small. ##### Expected Impact - The comment matches what the code does, or the handler uses a stack buffer so the claim becomes true.", "rec": "Either update the comment to say the handler allocates, or write the line with `write!` into a fixed stack buffer before calling `append_raw`. Updating the comment changes no behavior. Code owners: Cosmic Crafter \u003c61487138+theCosmicCrafter@users.noreply.github.com>", "phase": "P5"}, {"id": "sfind-6dddc7563af04422b009dadf0936528f", "sev": "low", "title": "Frame-size error message contains a 22-space gap from a broken string continuation", "cat": "other-malformed-message", "files": ["src-tauri/src/ffmpeg/mod.rs:1471-1481"], "pr": "", "rem": "", "desc": "##### Overview The user-facing \"effect changed the frame size\" error is a multi-line string literal written without `\\` line continuations. Each line break and the following indentation become part of the message, so it renders with long whitespace runs. ##### Maintainability Cost ``` \"...but the encode was opened for {}x{} ({} bytes per frame). An effect changed...\" ``` This message is shown in the Export panel status line (`Export failed: ...`). The literal at 1472 has the raw indentation inside the quotes, confirmed with `cat -A`, so the user sees an oddly spaced error. ##### Expected Impact - The message reads cleanly in the status bar and logs. - Assumption: the message is surfaced through ExportPanel's `err.message`.", "rec": "End each line of the literal with `\\` (or use concat!) so the indentation is stripped. Only the whitespace in the message changes. Code owners: Cosmic Crafter \u003c61487138+theCosmicCrafter@users.noreply.github.com>", "phase": "P5"}, {"id": "sfind-2a3d0a4116334c258bfda05aab47783a", "sev": "low", "title": "Module-wide too_many_arguments allow and stale horn_schunck doc", "cat": "convention-violation", "files": ["src-tauri/src/effects/motion.rs:184-193", "src-tauri/src/effects/motion.rs:7-7", "src-tauri/src/effects/motion.rs:97-108"], "pr": "", "rem": "", "desc": "##### Overview `#![allow(clippy::too_many_arguments)]` covers the whole module, but the only function it applies to is the private `block_diff`, which takes 10 positional args including two same-typed coordinate pairs. Separately, the `horn_schunck` docs describe a `blur_sigma` argument that the function doesn't have. ##### Maintainability Cost ``` block_diff(prev, curr, x0, y0, x1, y1, sx, sy, w, h) // easy to transpose coordinates /// * `blur_sigma` - optional pre-blur ... // no such parameter ``` The module is shared datamosh infrastructure. The blanket allow also hides the lint for any function added later. ##### Expected Impact - Removing or scoping the allow restores the lint for the rest of the module. - Readers stop looking for a pre-blur feature that doesn't exist.", "rec": "Bundle the block bounds into a small struct, or put `#[allow]` on block_diff only, and remove the module-level allow. Delete the blur_sigma doc line. None of this changes behaviour. Code owners: Cosmic Crafter \u003c61487138+theCosmicCrafter@users.noreply.github.com>", "phase": "P5"}, {"id": "sfind-8155749124b245cf9e88a1e1aaaad58e", "sev": "low", "title": "Rise's process_frame applies an undocumented colour remap that has nothing to do with dropping frames", "cat": "misleading-name", "files": ["src-tauri/src/effects/datamoshing/rise.rs:49-92", "src-tauri/src/effects/datamoshing/rise.rs:6-6"], "pr": "", "rem": "", "desc": "##### Overview `RiseDatamosh` is documented as 'progressively drop more I-frames'. Its `process_video` drops frames, but its `process_frame` (used for the single-frame/preview path) remaps luminance bands to hard-coded neon RGB colours. Nothing documents this. Most other drop-style temporal effects (`iframe_removal_advanced`, the `frame_*` effects) return the frame unchanged in `process_frame`, and `conformance_tests.rs` lists them as expected single-frame no-ops. ##### Maintainability Cost ``` Rise doc: \"drop more I-frames toward the end\" process_frame: 6 bands -> (0,184,255), (255,0,193), (150,0,255), (0,255,249) ... ``` What a user sees in a single-frame preview does not match the exported result, and a reader can't tell from the code whether the remap is intended. The band thresholds and colours are unnamed magic numbers. ##### Expected Impact - Single-frame output either matches what the effect is documented to do or is documented as intended. - Assumption: I couldn't confirm the original intent; the history shows only bulk 'feat' commits.", "rec": "If the remap is intended, move it into a named, documented const palette table and mention it in the doc comment, which changes no behaviour. If it's left over from another effect, make process_frame return `input.clone()` like its siblings and add the effect to the conformance no-op list. That second option changes behaviour, so confirm the intent first. Code owners: Cosmic Crafter \u003c61487138+theCosmicCrafter@users.noreply.github.com>", "phase": "P5"}, {"id": "sfind-bf3edc8e383d4522856ca4c6e03996d5", "sev": "low", "title": "Sidecar and checkpoint download/assemble loops are duplicated inline in install()", "cat": "duplicated-logic", "files": ["src-tauri/src/sam3_addon.rs:377-417", "src-tauri/src/sam3_addon.rs:419-456", "src-tauri/src/sam3_addon.rs:458-458"], "pr": "", "rem": "", "desc": "##### Overview `install()` contains two ~35-line blocks with the same steps: download parts into staging with progress emits, emit \"Verifying\", `join_and_verify`, rename into place, then delete the parts. Only the stage name, label, expected hash, and destination differ. A shared helper would mean changes to the download protocol (retry, resume, cancellation, cleanup on failure) are made once. ##### Maintainability Cost ``` sidecar block 377-417 vs checkpoint block 419-456 for part -> emit(stage,label) -> download_part(..., |d,t| emit(stage,label,..)) -> push emit(stage,\"Verifying\") -> join_and_verify(parts, staging/x, hash) -> rename -> remove parts ``` The two blocks have not drifted yet. Both also share one gap: when `download_part` or `join_and_verify` fails, the earlier parts and the staging dir stay on disk, because the `?` skips the cleanup at line 458. That is gigabytes of orphaned data, and fixing it today means patching both blocks. ##### Expected Impact - One `fetch_asset(stage, label_prefix, parts, expected, dest)` helper holds the protocol, so a retry, cancel, or cleanup fix lands for both assets. - `install()` becomes a short readable plan. - Assumes the add-on gets future protocol changes (it has a schema version and a manifest-override env var, which suggests it will).", "rec": "Extract `async fn fetch_asset(app, client, staging, stage: &str, label: &str, parts: &[AssetPart], expected: &str, dest: &Path, done: &mut u64, total: u64) -> Result\u003c()>` that contains the loop, the \"Verifying\" emit, `join_and_verify`, the rename, and the part removal. Call it once per asset. The emits, hashes, and paths are identical, so behavior is unchanged. Code owners: Cosmic Crafter \u003c61487138+theCosmicCrafter@users.noreply.github.com>", "phase": "P5"}, {"id": "sfind-1571611934ac4a2e86da6c7c25a9a1c0", "sev": "low", "title": "Tomato 'pulse' mode counter never advances, so its else branch is dead", "cat": "other-dead-branch", "files": ["packages/python-backend/DatamoshLib/Tomato/tomato.py:175-188", "packages/python-backend/DatamoshLib/Tomato/tomato.py:190-194"], "pr": "", "rem": "", "desc": "##### Overview In `mosh()` pulse mode, `j` starts at 0 and is only incremented inside the `else` branch. Because `j % pulselen == 0` is always true, the `else` never runs and every frame is repeated `pulselen` times. This differs from the intended alternating pulse. The vendored file also carries stale debug comments (`#print('*needs debugging lol help thx*')`) and placeholder modes ('exponential', 'swap'). ##### Maintainability Cost ``` j = 0 ; if j % pulselen == 0: repeat x ; else: append x; j += 1 # j never changes ``` `pulse` is reachable: `mosh_cli.py` lists it in `tomato_modes`. Readers have to trace the indentation to see that the branch is dead, and the stale comments suggest the jiggle bug is still unresolved. ##### Expected Impact - The pulse logic reads as it behaves, or is fixed on purpose. - Stale debugging comments are removed. - Assumption: the code is vendored and unchanged since the initial commit, so its traffic is low.", "rec": "Delete the commented-out print. For pulse, either write the current behaviour out directly (`final.extend([x]*pulselen)` for every frame), which is behaviour-preserving, or move `j += 1` out of the else to restore the intended alternation, which changes behaviour. Code owners: Cosmic Crafter \u003c61487138+theCosmicCrafter@users.noreply.github.com>", "phase": "P5"}, {"id": "sfind-4b5f7b4343ec4c6c9cc350e1ff205ef3", "sev": "low", "title": "copy_bundled_ffmpeg/copy_bundled_ffglitch are copies of each other, and install marks mode \"local\" before it succeeds", "cat": "duplicated-logic", "files": ["src-tauri/src/environment.rs:138-237", "src-tauri/src/environment.rs:320-360", "src-tauri/src/environment.rs:65-74", "src-tauri/src/lib.rs:98-107"], "pr": "", "rem": "", "desc": "##### Overview The module has two ~50-line functions that are the same code with different binary names. `install_local_environment` also calls `save_config(\"local\")` before any install step runs, and `save_config` drops write errors. If the install fails partway, the config still reads \"local\", so `get_environment_status` reports the venv python path even though no venv exists. ##### Maintainability Cost ``` copy_bundled_ffmpeg (138-187) == copy_bundled_ffglitch (189-237) // same 4-candidate list x2, same copy loop x2, same post-check install_local_environment: save_config(\"local\") @322 -> run_command(...)? fails -> mode stays \"local\" save_config: let _ = fs::write(..., to_string_pretty(..).unwrap_or_default()) ``` Adding a new target triple or search directory means editing four candidate arrays. The early `save_config` makes the persisted state claim an outcome that has not happened yet. It is the same value written again at line 358, so the first call does nothing useful. Traffic is low: lib.rs (95-110) records that these commands are registered but have no UI yet. That is why this is LOW. Once someone wires the flow, both problems become live. ##### Expected Impact - One `copy_sidecar_pair(dir, [names])` helper replaces two copies, so new triples or paths are added in one place. - Mode is only persisted after a successful install, so the status no longer points at a venv that is missing. - Assumes the commands stay unwired for now (lib.rs comment); severity goes up once a UI calls them.", "rec": "Extract `fn copy_bundled_pair(out_dir, names: [&str; 2]) -> Result\u003c(), String>` that builds the candidate list from the name. Call it from both sites; the copy order and error text stay identical. Delete the first `save_config(&app, \"local\")` at line 322, which leaves the final state of a successful run unchanged. Have `save_config` return the write error so the caller can propagate it. Code owners: Cosmic Crafter \u003c61487138+theCosmicCrafter@users.noreply.github.com>", "phase": "P5"}, {"id": "sfind-ea09058ad45a4c22aeab8af4313c77be", "sev": "high", "title": "Post-process writes activeMask via raw setState, skipping maskRevision so the CPU preview does not re-render", "cat": "leaky-abstraction", "files": ["src/components/MaskPanel.tsx:225-258", "src/components/PreviewViewport.tsx:151-162", "src/store/index.ts:1233-1234", "src/store/index.ts:1302-1312"], "pr": "", "rem": "", "desc": "##### Overview `handlePostprocess` replaces the active SAM3 mask by calling `useAppStore.setState({...activeMask: processed})` directly. Every store action that changes `activeMask` (`setActiveMask`, `setSam3Masks`, `setSam3MaskIndex`, undo) also increments `maskRevision`. PreviewViewport's and Toolbar's CPU render signature is keyed on `maskRevision`, not on `activeMask`. After a post-process, the CPU (Rust) preview therefore keeps showing the old mask until something else changes. Routing the write through a store action fixes this. ##### Maintainability Cost ``` store: setActiveMask / setSam3Masks / setSam3MaskIndex / undoMask -> maskRevision + 1 MaskPanel.handlePostprocess: useAppStore.setState({ activeMask: processed, ... }) -> maskRevision unchanged PreviewViewport.cpuRenderSignature = effectStack… + `|${maskRevision}` -> no re-render ``` The store comments say the actions exist as the boundary where IPC responses become trusted state, so callers do not each have to remember the invariants. This component bypasses that boundary and silently breaks the \"activeMask change ⇒ maskRevision bump\" invariant. It also clones `sam3MaskScores` without modifying it. MaskPanel is the only place `useAppStore.setState` is called outside tests. ##### Expected Impact - In CPU preview mode, the result of a post-process shows up immediately. - The maskRevision invariant is enforced in one place, the store, instead of depending on each caller. - Assumption: the WebGL path reacts to `activeMask` directly, so the stale preview shows only in CPU-preview mode (`useCpuPreview`). This was inferred from PreviewViewport lines 156-161 and 1127 and not verified in a running app.", "rec": "Add a store action such as `replaceActiveSam3Mask(processed)` that updates `sam3Masks[sam3MaskIndex]` when the index is valid, sets `activeMask`, and increments `maskRevision`. Call it from handlePostprocess. The state is the same as today apart from the revision bump, which is the intended contract. Code owners: Cosmic Crafter \u003c61487138+theCosmicCrafter@users.noreply.github.com>", "phase": "P6"}, {"id": "sfind-373886ccb9f34ed78efc9435a6bf7660", "sev": "high", "title": "Preview error paths use console.* instead of the imported logger, so failures never reach the release log file", "cat": "convention-violation", "files": ["src/components/PreviewViewport.tsx:1052-1058", "src/components/PreviewViewport.tsx:709-716", "src/components/PreviewViewport.tsx:738-743", "src/utils/logger.ts:16-35"], "pr": "", "rem": "", "desc": "##### Overview PreviewViewport imports `logger`, but only one error site uses it (line 741). The other eight warn/error sites call `console.warn`/`console.error` directly. These cover proxy generation, drag-and-drop load, open-dialog failure, WebGL context loss, WebGL render errors and CPU preview render failures. `logger.ts` says release builds detach the console, so these diagnostics are lost in production. Switching them to `logger.warn`/`logger.error` would send them to the log file. ##### Maintainability Cost ``` logger.error(\"Preview\", ...) x1 (line 741) -> console + log file console.error / console.warn x8 (379,416,435,712,944,948,1055,1110) -> console only (gone in release) ``` The file has had about 21 commits in the last three months, and it is the main viewport. The `logger.ts` header explains why the logger exists: \"Release builds detach the console... a failure in the frontend left the log file showing nothing but a clean startup.\" This file follows that rule in one place and ignores it in eight others. A user report about a lost WebGL context or a failed render therefore comes with no logs. ##### Expected Impact - WebGL context loss, render failures and proxy failures show up in the app log for support and debugging. - One logging idiom in the file means new code is less likely to copy `console.*`. - Assumes `logger.warn/error` keeps forwarding to `log_frontend`, as `src/utils/logger.ts` does now.", "rec": "Change each console.warn/console.error to logger.warn/logger.error with a category such as \"Preview\", and pass the error as context (`{ err: String(e) }`). The logger still writes to the console, so dev behaviour stays the same. The only addition is forwarding to the log file.", "phase": "P6"}, {"id": "sfind-2f62073ef3754af0b7522beab69a87e2", "sev": "medium", "title": "\"Collect docked tab ids\" model walk copied five times, already drifted", "cat": "duplicated-logic", "files": ["src/components/DockSystem/DockLayout.tsx:205-209", "src/components/DockSystem/DockLayout.tsx:240-248", "src/components/DockSystem/DockLayout.tsx:80-84"], "pr": "", "rem": "", "desc": "##### Overview DockLayout walks the flexlayout model to collect tab component ids in five places: mount, reset, `onModelChange`, `addPanel` and `onExternalDrag`. Three of these push the result into `setDockedPanels`. The copies are no longer the same: `onModelChange` skips empty component strings and the mount/reset copies do not, so `dockedPanels` can hold different values depending on which path ran last. ##### Maintainability Cost ``` mount L80-84: push(getComponent() as string) -> setDockedPanels reset L205-209: push(getComponent() as string) -> setDockedPanels onModelChange L240-248: if (componentStr) push(...) -> setDockedPanels addPanel L152-156 / onExternalDrag L181-183: same walk for existence checks ``` The store's `dockedPanels` feeds Toolbar's docked-state menu (`dockedIds`). If one path keeps an `undefined` or empty entry and another filters it out, the menu can disagree depending on whether the last change was a reset or a user drag. Every new panel lifecycle path has to copy this walk again. The file has had 7 commits. ##### Expected Impact - One `getDockedComponentIds(model)` helper gives a single filter rule for all five call sites. - Assumes flexlayout can return tabs with no component, which is why the filter was added in `onModelChange`.", "rec": "Add `function dockedComponentIds(m: Model): string[]` with the `if (componentStr)` filter and use it at all five sites (`.includes`/`new Set` for addPanel and onExternalDrag). Also add a `syncDocked(m)` that calls `useAppStore.getState().setDockedPanels(...)`. The only behaviour change is that mount/reset also drop empty ids, which onModelChange already does. Code owners: Cosmic Crafter \u003c61487138+theCosmicCrafter@users.noreply.github.com>", "phase": "P6"}, {"id": "sfind-223b1541ad914642a86fc04019afad7a", "sev": "medium", "title": "Media-load sequence copied across open/revert/animate handlers and already drifted", "cat": "duplicated-logic", "files": ["src/components/Toolbar.tsx:176-214", "src/components/Toolbar.tsx:240-256", "src/components/Toolbar.tsx:309-328"], "pr": "", "rem": "", "desc": "##### Overview `handleOpen`, `handleRevertToStill` and `runAnimateAsVideo` each repeat the same post-load sequence: `onFileLoaded()`, fetch metadata, reload the frame into SAM3 if it is ready, then set a status message from `synced`. `handleOpen` was fixed to report a failed preview sync as an error and to log SAM3 failures through `logger`. The other two copies did not get either fix. ##### Maintainability Cost ``` handleOpen : !synced -> setStatusMessage(\"...preview did not refresh\", \"error\"); SAM3 fail -> logger.warn handleRevertToStill : !synced -> \"Reverted to still: X (preview sync pending)\"; SAM3 fail -> console.warn runAnimateAsVideo : !synced -> \"Animated as video: X (preview sync pending)\"; SAM3 fail -> console.warn ``` The comment in `handleOpen` calls \"(preview sync pending)\" \"success-shaped text for a backend failure, which neither the log heuristic nor the user could tell had gone wrong\". The revert and animate paths still produce that text. The fix stayed in one copy because there is no shared helper. Toolbar is high churn (29 commits). ##### Expected Impact - One `finishMediaLoad(path, labels)` helper applies the error-status and logger rules to every load path. - Revert and animate failures stop showing up as success. - Assumes the `handleOpen` behaviour is the intended one, as its comment says.", "rec": "Extract `async function finishMediaLoad(path, successText)` that runs `onFileLoaded`, loads metadata (logging with logger.warn), reloads into SAM3 if `sam3Ready` (logger.warn on failure), and calls `setStatusMessage(synced ? successText : `${successText}, but the preview did not refresh`, synced ? undefined : \"error\")`. Call it from all three handlers. Success paths behave the same; failed syncs now report as errors, matching handleOpen. Code owners: Cosmic Crafter \u003c61487138+theCosmicCrafter@users.noreply.github.com>", "phase": "P6"}, {"id": "sfind-e80f6eabc3534821a7c02538cd48d574", "sev": "medium", "title": "Toolbar open/metadata/SAM3 failures logged with console.* despite importing logger", "cat": "convention-violation", "files": ["src/components/Toolbar.tsx:194-199", "src/components/Toolbar.tsx:210-215", "src/components/Toolbar.tsx:250-256", "src/components/Toolbar.tsx:317-323"], "pr": "", "rem": "", "desc": "##### Overview Toolbar imports `logger` and uses `logger.warn` once (line 197, SAM3 image load). Eight similar failures use `console.error`/`console.warn` instead: original-frame load, metadata load, handleOpen, reverted-still metadata, reverted-still SAM3 load, proxy generation, animated-frame SAM3 load and handleAnimateAsVideo. In release builds these never reach the log file. ##### Maintainability Cost ``` line 197 logger.warn(\"sam3\", \"Failed to load new image into SAM3\") -> log file line 320 console.warn(\"Failed to load animated frame into SAM3\") -> lost in release line 252 console.warn(\"Failed to load reverted still into SAM3\") -> lost in release ``` The same kind of failure (loading a frame into SAM3) is logged three different ways in one file, and only one of them survives in production. Toolbar is the app's main command surface and has about 21 commits in the last three months. Copies of these blocks keep the wrong idiom alive. ##### Expected Impact - Open, animate and SAM3 sync failures can be diagnosed from user log files. - The three SAM3-load warning sites log consistently. - Assumes logger forwarding works as `src/utils/logger.ts` describes.", "rec": "Replace the console.* calls with logger.warn/logger.error and a consistent category (e.g. \"Toolbar\", \"sam3\"). The logger also writes to the console, so dev output is unchanged and release builds keep the record. Note: Member of root-cause group sfind-373886ccb9f34ed78efc9435a6bf7660 (no-console lint rule + logger). Code owners: Cosmic Crafter \u003c61487138+theCosmicCrafter@users.noreply.github.com>", "phase": "P6"}, {"id": "sfind-f836246fbe5545818db1cf19a16abbe8", "sev": "medium", "title": "Two clearAutoSave implementations: one guarded, the hook's copy can throw", "cat": "duplicated-logic", "files": ["src/hooks/useProjectSession.ts:217-219", "src/hooks/useProjectSession.ts:53-59", "src/hooks/useProjectSession.ts:71-74"], "pr": "", "rem": "", "desc": "##### Overview The module exports a top-level `clearAutoSave()` that wraps `localStorage.removeItem` in try/catch. The hook returns a second `clearAutoSave` with the same name that calls `removeItem` with no guard. `useProject.ts` imports the module function and `AppLayout.tsx` uses the hook's copy, so the two callers get different error behaviour from the same name. `saveRecentProjects` is also unguarded, while every other storage helper in the file catches errors. ##### Maintainability Cost ``` export function clearAutoSave() L53-59 try { removeItem } catch {} \u003c- useProject.ts:84 hook's const clearAutoSave L217-219 removeItem (unguarded) \u003c- AppLayout.tsx:380 saveRecentProjects L71-74 setItem (unguarded) \u003c- addToRecent ``` The two functions share a name, so a reader cannot tell which one a call site uses without checking imports. In storage-restricted modes, the AppLayout restore-dialog dismissal and `addToRecent` can throw from event handlers, while the matching operations elsewhere fail silently. The file also uses `console.error` for media-restore failures (L188, L204), and `logger.ts` says those messages are not written in release builds. ##### Expected Impact - One `clearAutoSave` with one behaviour. - All storage writes in the file follow the same best-effort convention. - Restore failures reach the log file.", "rec": "Remove the hook-local `useCallback` and return the module-level `clearAutoSave` from the hook. Wrap `saveRecentProjects` in the same try/catch. Change the two `console.error` calls to `logger.error(\"session\", ...)`. Nothing changes when storage works; a storage failure is now ignored on these paths instead of throwing. Code owners: Cosmic Crafter \u003c61487138+theCosmicCrafter@users.noreply.github.com>", "phase": "P6"}, {"id": "sfind-91b3ac7317f94264ae97906687592336", "sev": "medium", "title": "console.warn used instead of logger in store and hooks, so SAM3 shutdown and manifest failures are lost in release builds", "cat": "convention-violation", "files": ["src/hooks/useAudioEngine.ts:260-265", "src/hooks/useSam3IdleShutdown.ts:47-53", "src/store/index.ts:1288-1293"], "pr": "", "rem": "", "desc": "##### Overview The repo has `utils/logger.ts` because release builds have no console. ErrorBoundary and store/index.ts itself (line 1017, `logger.error(\"status\", msg)`) say so explicitly. Three batch sites still use `console.warn`, so these failures leave no record in production. ##### Maintainability Cost ``` store/index.ts:1290 console.warn(setSam3Masks dropped N invalid masks) (file already imports logger) hooks/useSam3IdleShutdown.ts:52 console.warn(\"SAM3 idle shutdown failed\") -> ~6 GB not reclaimed, no trace hooks/useAudioEngine.ts:261 console.warn(\"Manifest analysis failed...\") -> silent fallback to live engine ``` The idle-shutdown failure matters most: the hook exists to free about 6 GB of RAM, and when it fails the interval keeps retrying every 30 s with nothing in the log file. store/index.ts is the most-read frontend module, and it mixes `logger` and `console` within the same file. ##### Expected Impact - These failures appear in the support log file. - Removes the mixed convention inside the store. - Assumption: logger.warn forwards to the Tauri log as the matcher notes and logger.ts lines 29-30 indicate.", "rec": "Replace each `console.warn(...)` with `logger.warn(\"\u003carea>\", message, { error: String(e) })`. Control flow is unchanged; only the log destination changes. Note: Member of root-cause group sfind-373886ccb9f34ed78efc9435a6bf7660 (no-console lint rule + logger). Code owners: Cosmic Crafter \u003c61487138+theCosmicCrafter@users.noreply.github.com>", "phase": "P6"}, {"id": "sfind-1ec9f7e21eb747029be50224df6dea11", "sev": "low", "title": "Audio load and beat-detection failures go to console.error instead of logger.error, so they never reach the release log", "cat": "convention-violation", "files": ["src/components/AudioPanel/index.tsx:106-109", "src/components/AudioPanel/index.tsx:39-75", "src/utils/logger.ts:17-36"], "pr": "", "rem": "", "desc": "##### Overview AudioPanel reports its three failure paths with `console.error`. The repo's `logger.error` exists because release builds detach the console: logger forwards warn/error to the app log file through `log_frontend`. With `console.error`, a user's audio-load or beat-detection failure leaves no trace in the logs collected for a bug report. ##### Maintainability Cost ``` AudioPanel: console.error(\"Audio file load failed:\", err) x2, console.error(\"Beat detection failed:\", err) logger.ts: \"Release builds detach the console ... console.error goes nowhere\" -> forward(\"error\", ...) PreviewViewport / Toolbar / AppLayout / store: import { logger } ``` The status bar still shows a message, so the user sees something. But the stack and error detail are lost for whoever debugs the report, which is the exact problem logger.ts documents. The two load handlers (`handleFile`, `handleDrop`) also duplicate the same try/catch body, so a fix has to be made twice. ##### Expected Impact - Audio failures show up in the production log file, like other frontend failures. - Sharing one `loadFile(file)` callback between the two handlers removes the duplicated error path. - Assumes `logger.error` forwarding (logger.ts) is the team-wide convention, as its header and other components' imports indicate.", "rec": "Replace the three `console.error` calls with `logger.error(\"AudioPanel\", \"...\", { error: String(err) })`. Optionally extract a shared `loadAndReport(file)` used by both handleFile and handleDrop. The status messages and control flow stay identical. Note: Member of root-cause group sfind-373886ccb9f34ed78efc9435a6bf7660 (no-console lint rule + logger). Code owners: Cosmic Crafter \u003c61487138+theCosmicCrafter@users.noreply.github.com>", "phase": "P6"}, {"id": "sfind-7ca8742c1e7048bea03a11f6c17d56ca", "sev": "low", "title": "Backend cancel failure logged with console.error, which release builds drop", "cat": "convention-violation", "files": ["src/components/ExportPanel/index.tsx:360-373", "src/hooks/useAutoAudioExtract.ts:136-145"], "pr": "", "rem": "", "desc": "##### Overview `handleCancel` reports a failed `cancelExport()` IPC with `console.error`. The repo's `logger` exists because release builds have no console. Elsewhere, for example in useAutoAudioExtract and ErrorBoundary, the code says this explicitly and was migrated to the logger. A failed backend cancel, which leaves an export running and holding the export slot, is therefore not recorded anywhere in production. ##### Maintainability Cost ``` ExportPanel:370 console.error(\"Failed to cancel export on the backend:\", err) -> lost in release useAutoAudioExtract:144 logger.warn(...) // comment: release build has no console ``` ExportPanel (1.3k lines) is the main export UI. The cancel path is the one the comments at 361-367 describe as easy to get wrong, so a lost failure here is exactly what someone debugging a report would need. ##### Expected Impact - A failed backend cancel ends up in the log file users can send in. - Matches the logger convention the rest of the codebase has adopted.", "rec": "Replace with `logger.error(\"export\", \"Failed to cancel export on the backend\", { err: String(err) })`. The UI behavior is the same. Note: Member of root-cause group sfind-373886ccb9f34ed78efc9435a6bf7660 (no-console lint rule + logger). Code owners: Cosmic Crafter \u003c61487138+theCosmicCrafter@users.noreply.github.com>", "phase": "P6"}, {"id": "sfind-8aac19346aea42d5a9263202de8bd9d6", "sev": "low", "title": "LUT dimension mismatch reported via console.warn instead of logger", "cat": "convention-violation", "files": ["src/engine/lut/loader.ts:114-119"], "pr": "", "rem": "", "desc": "##### Overview `loadLUT` warns about a non-512×512 LUT image with `console.warn`. In release builds that warning is lost. A wrong-size LUT does not throw: it renders incorrect colors, so this warning is the only diagnostic a user report could contain. ##### Maintainability Cost ``` loader.ts:116 console.warn(`LUT ${url} has unexpected dimensions ...`) -> no console in release ``` The surrounding comments (102-105) say that a failed LUT load used to be the whole explanation for a black preview. That is the same reason this diagnostic needs to reach the log file. The repo's convention is `logger.warn`. ##### Expected Impact - Custom-LUT grading problems leave a trace in the log. - Consistent with the logger convention.", "rec": "Replace with `logger.warn(\"lut\", \"Unexpected LUT dimensions\", { url, width: img.width, height: img.height })`. There is no functional change. Note: Member of root-cause group sfind-373886ccb9f34ed78efc9435a6bf7660 (no-console lint rule + logger). Code owners: Cosmic Crafter \u003c61487138+theCosmicCrafter@users.noreply.github.com>", "phase": "P6"}, {"id": "sfind-851e895666ca4e9787c19693646f4b7c", "sev": "low", "title": "Orphaned JSDoc for VIDEO_ONLY_ON_IMAGE_WARNING sits above REQUIRES_SELECTION", "cat": "other-misplaced-doc", "files": ["src/utils/effectConverter.ts:1062-1076", "src/utils/effectConverter.ts:1099-1100"], "pr": "", "rem": "", "desc": "##### Overview The comment \"Shared copy for the video-only-effect-on-a-still-image warning\" was left directly above another JSDoc block for `REQUIRES_SELECTION`. The constant it describes, `VIDEO_ONLY_ON_IMAGE_WARNING`, is 35 lines further down with no doc of its own. ##### Maintainability Cost ``` L1062 /** Shared copy for the video-only warning ... */ \u003c- describes L1099 L1067 /** Effects that render nothing until ... */ L1076 export const REQUIRES_SELECTION L1099 export const VIDEO_ONLY_ON_IMAGE_WARNING \u003c- undocumented ``` Editor hovers and readers attach two stacked docs to `REQUIRES_SELECTION`. The note that the warning text is shared by two surfaces and must stay in sync is lost from the constant it applies to. ##### Expected Impact - The doc shows up in hovers on the right symbol. - No behavior change.", "rec": "Move the comment at L1062-1066 so it sits directly above `export const VIDEO_ONLY_ON_IMAGE_WARNING`. This only moves a comment. Code owners: Cosmic Crafter \u003c61487138+theCosmicCrafter@users.noreply.github.com>", "phase": "P6"}, {"id": "sfind-04b65d41f82847e799f43fa348890bde", "sev": "low", "title": "Stale comment claims in/out commands \"set 0 and 300 regardless\" while the code uses the playhead", "cat": "other-stale-comment", "files": ["src/components/CommandPalette.tsx:97-99"], "pr": "", "rem": "", "desc": "##### Overview Above the set-in-point/set-out-point registrations, the comment says \"At the playhead, like the I / O keys. These set 0 and 300 regardless.\" The second sentence describes the old hard-coded behaviour. The code below now uses `useAppStore.getState().currentTime`. A reader gets two contradictory statements about what the command does. ##### Maintainability Cost ``` // At the playhead, like the I / O keys. These set 0 and 300 regardless. setInPoint(useAppStore.getState().currentTime) ``` Nearby comments record past bugs (the old hard-coded 300 for \"Go to end\"). This leftover makes it look as if the bug is still present, which can send someone after a non-existent defect or lead them to \"restore\" the literals. The getState() reads themselves are correct: they read at invocation time. ##### Expected Impact - The comment matches the behaviour. - Low traffic. This is a cleanup to do opportunistically.", "rec": "Delete the sentence \"These set 0 and 300 regardless.\" This is a comment-only change. Code owners: Cosmic Crafter \u003c61487138+theCosmicCrafter@users.noreply.github.com>", "phase": "P6"}, {"id": "sfind-8bc4b63ab81b4b99b9fa2efc8eed2abc", "sev": "low", "title": "webkitAudioContext double-cast duplicated with AudioEngine", "cat": "type-escape-hatch", "files": ["src/engine/audio/AudioEngine.ts:101-112", "src/hooks/useSoundManager.ts:10-24"], "pr": "", "rem": "", "desc": "##### Overview `SoundManager.ensureContext` and `AudioEngine.ensureContext` each construct an AudioContext with the same `(window as unknown as { webkitAudioContext })` fallback cast and the same suspended-resume step. The AudioEngine copy calls `resume()` without `void` or error handling. A shared `createAudioContext()` helper would remove the type escape hatch in both. ##### Maintainability Cost ``` useSoundManager.ts:14 new (window.AudioContext || (window as unknown as {webkitAudioContext}).webkitAudioContext)() AudioEngine.ts:103-106 identical construction; resume() promise unhandled vs `void` here ``` The impact is small (two sites, rarely changed), but the copies already handle `resume()` differently. ##### Expected Impact - One typed helper. The double casts go away. - The same resume handling in both places.", "rec": "Add `createAudioContext(): AudioContext` in a shared util that declares `interface Window { webkitAudioContext?: typeof AudioContext }` once, and use it in both classes. Construction behavior is identical. Code owners: Cosmic Crafter \u003c61487138+theCosmicCrafter@users.noreply.github.com>", "phase": "P6"}, {"id": "sfind-0106d4c1ccb947c4a434ecff2cda3cb0", "sev": "medium", "title": "Modal-dismiss preamble is copy-pasted into ~18 E2E specs, is redundant with the mock, and costs up to 6s per test", "cat": "duplicated-logic", "files": ["tests/e2e/app-launch.spec.ts:4-22", "tests/e2e/dock-system.spec.ts:4-20", "tests/e2e/effect-stack.spec.ts:4-12", "tests/e2e/mocks/tauri-mock.ts:9-14", "tests/e2e/stress-test.spec.ts:4-15"], "pr": "", "rem": "", "desc": "##### Overview Roughly 18 spec files copy the same `beforeEach`: goto, wait for header, then click \"Discard\", \"Skip\" and \"Get Started\", each with `timeout: 2000` and `.catch(() => {})`. `tauriMockScript` already sets `onboardingDismissed` and clears autosave before the app renders, so these clicks normally find nothing. Each one waits the full 2 s and then has its error swallowed. A shared helper would remove the copies and the dead waits. ##### Maintainability Cost ``` 18 specs x beforeEach: 3 x click({timeout:2000}).catch(() => {}) tauri-mock.ts L9-14: localStorage.setItem(\"onboardingDismissed\",\"true\"); removeItem(autosave) stress-test.spec.ts L4-10: never copied the preamble -> one test hung 30s on the onboarding modal ``` The copies have already drifted. Some use a multi-line chain and some a single line. app-launch waits for `header` while the others wait for `header, [data-testid='toolbar']`. stress-test.spec.ts left the preamble out completely, and its own comment records that this caused a 30 s hang. Because every failure is swallowed, a renamed button or a modal that really appears is never reported. Tests just get slower or flakier. ##### Expected Impact - One `gotoApp(page)` fixture replaces the 18 copies, so new specs get the right setup automatically. - Up to about 6 s of dead waiting per test goes away across ~74 tests, assuming the modals are absent because the mock suppresses them. - A real unexpected modal can be reported (`isVisible` check) instead of silently timing out.", "rec": "Add a `tests/e2e/fixtures.ts` that exports `test.extend` with a page fixture, or a `gotoApp(page, mock = tauriMockScript)` helper. It should add the init script, navigate, and wait for the header. For any modal that can still appear, check with a zero-wait `locator.isVisible()` and only click when it is visible, rather than awaiting a 2 s click and catching the error. Replace the beforeEach in every spec with that helper. Tests see the same app state and skip the dead waits. Note: Shared preamble copy-pasted into ~18 e2e specs; fix with one Playwright fixture/helper. Duplicates dismissed: sfind-78d82f27bf7645c9b0c3076ac35ccc5a, sfind-92599bb6ce37408cac15b7d9746d1ac5. Code owners: Cosmic Crafter \u003c61487138+theCosmicCrafter@users.noreply.github.com>", "phase": "P7"}, {"id": "sfind-d297574e4c734e2385659f9d13b54e99", "sev": "medium", "title": "Parity test cannot fail: identical placeholder PNGs plus a catch that swallows everything without \"FAIL\"", "cat": "swallowed-error", "files": ["tests/e2e/run-parity.spec.ts:34-57", "tests/e2e/run-parity.spec.ts:70-75"], "pr": "", "rem": "", "desc": "##### Overview The \"WebGL and CPU renders should match\" test has two ways to pass without checking parity. If the canvas or the CPU `\u003cimg>` is not visible, it writes the same hard-coded 1x1 PNG to that path. When neither is visible, both inputs are the same placeholder bytes, so the auditor trivially passes. The whole body is also wrapped in a `catch` that rethrows only when `e.message` contains \"FAIL\". A missing `python`, a missing `render_parity_auditor.py`, a screenshot error or a non-zero exit with other text is logged with `console.error`, and the test goes green. ##### Maintainability Cost ``` canvas hidden && img hidden -> webgl.png == cpu.png == 1x1 placeholder -> PASS execSync throws ENOENT (no python) -> catch -> message lacks \"FAIL\" -> test passes ``` This is the repo's only end-to-end preview/export parity check, and parity is the main concern in effectConverter.ts. A test that can only fail on one specific substring gives false assurance, and every engineer who sees it green assumes parity was verified. The file also needs a `@ts-expect-error` to read `import.meta.dirname`. ##### Expected Impact - Parity regressions and broken tooling show up as failures instead of green runs. - Assumption: CI runs this spec, so its pass status is relied on.", "rec": "Assert that the canvas and the preview image are visible, or call `test.skip(reason)` when the environment cannot produce them, instead of writing placeholders. Remove the try/catch so `execSync` errors and `expect` failures propagate. If python is optional, check for it up front and `test.skip`. Code owners: Cosmic Crafter \u003c61487138+theCosmicCrafter@users.noreply.github.com>", "phase": "P7"}, {"id": "sfind-c380b54f1f75413ba9793854a7f4d2f5", "sev": "medium", "title": "Profiler references undefined globals (known_pids, CRASH_LOG_FILE, HEAP_CORRUPTION_CODE) and crashes on its first loop", "cat": "other-undefined-name", "files": ["tools/resource_profiler.py:10-13", "tools/resource_profiler.py:131-156", "tools/resource_profiler.py:57-70"], "pr": "", "rem": "", "desc": "##### Overview The crash-detection code added in commit 7e84729 uses `known_pids`, `CRASH_LOG_FILE` and `HEAP_CORRUPTION_CODE`, but none of them is defined anywhere in the file. `log_resources()` calls `check_terminated_processes()` on the first iteration, which hits `known_pids - current_pids` and raises NameError. The tool cannot run. In addition, bare `except: pass` around per-PID reads and `except Exception: return {}` around nvidia-smi make a missing GPU tool look the same as 0 MB. ##### Maintainability Cost ``` log_resources() -> check_terminated_processes(all_pids) -> known_pids (undefined) -> NameError ``` This is the repo's documented RAM/VRAM profiling tool (task.md). Anyone investigating memory or heap-corruption crashes finds it broken and has to rebuild it. The swallowed nvidia-smi failure means even a fixed version would report 0 VRAM, not \"unavailable\". ##### Expected Impact - The profiler runs again and the crash logging actually works. - A missing nvidia-smi shows up as missing, not as 0 MB. - Assumption: the script is still meant to be used (task.md lists it as delivered).", "rec": "Add `known_pids: set[int] = set()`, `CRASH_LOG_FILE = \"crash_log.csv\"`, and `HEAP_CORRUPTION_CODE = 0xC0000374` to the configuration block. Narrow the bare excepts to `(psutil.NoSuchProcess, psutil.AccessDenied)`. Have get_vram_usage return None on failure so the CSV can record 'n/a'. Nothing currently works, so this only adds the intended behavior. Code owners: Cosmic Crafter \u003c61487138+theCosmicCrafter@users.noreply.github.com>", "phase": "P7"}, {"id": "sfind-a2e6bfcbb24f40059e55bb88c7b5f482", "sev": "medium", "title": "Verification overrides target param IDs and value types that the effects don't read, so the harness silently tests defaults", "cat": "other-schema-drift", "files": ["src-tauri/src/effects/glitch/macroblock_glitch.rs:81-92", "src-tauri/src/effects/verification.rs:206-207", "src-tauri/src/effects/verification.rs:259-283", "src-tauri/src/effects/verification.rs:742-803"], "pr": "", "rem": "", "desc": "##### Overview `build_default_params` stores per-effect \"stronger than default\" overrides keyed by hand-typed param IDs. Several of those IDs don't exist on the effect, and several values are floats for params the effect reads with `as_u64()`. The overrides do nothing, so the harness never exercises the settings it claims to. This is the same schema drift that `allowlist_tests` was added to prevent for `NEEDS_INPUT_EFFECTS`, but nothing checks the overrides. ##### Maintainability Cost ``` glitch.slice_shift inserts shift_amount -> effect params: slice_height, max_shift glitch.macroblock_glitch inserts block_size, amount -> effect reads u_blockSize, u_intensity pixel_geo.block_shift inserts shift_amount -> effect params: block_size, max_shift glitch.crc_mismatch shift_amount=30.0, scanline_interval=4.0 -> read via as_u64 -> Float ignored -> 16 / 8 ``` This harness backs `mosh-verify verify-all` and the 80%-pass test. Anyone reading the override table will assume these effects are verified at the stronger values, but they run at defaults. ##### Expected Impact - The overrides take effect, or are deleted because they were never needed. - A guard test (every override key must be in `meta.parameters`) catches renames, the same way the allowlist tests do.", "rec": "Correct the keys (max_shift, u_blockSize/u_intensity). In build_default_params, only insert overrides whose key exists in `params`. Add a test in `allowlist_tests` that asserts every override key appears in the effect's ParameterDef list. If the param helper from the slice_shift finding lands, the float/int problem goes away; until then, write integer-valued overrides as integer JSON. Code owners: Cosmic Crafter \u003c61487138+theCosmicCrafter@users.noreply.github.com>", "phase": "P7"}, {"id": "sfind-af5d9f5cd0d34913b5177f11581d2245", "sev": "medium", "title": "mosh-verify ignores errors writing its output directories and CSV reports, then prints the report path", "cat": "swallowed-error", "files": ["src-tauri/src/bin/mosh_verify.rs:1314-1317", "src-tauri/src/bin/mosh_verify.rs:1806-1809", "src-tauri/src/bin/mosh_verify.rs:515-518", "src-tauri/src/bin/mosh_verify.rs:731-750"], "pr": "", "rem": "", "desc": "##### Overview `mosh-verify` runs in CI and in the e2e backend tests. It calls `let _ = std::fs::create_dir_all(...)` and `let _ = std::fs::write(&report_path, ...)` and ignores both results. It then prints `Report: \u003cpath>` and exits based only on effect errors. If a write fails, the verification run looks successful but produces no report. The CSV header/format/write block is also copied into three subcommands. ##### Maintainability Cost ``` render (732-734), audio-render (1315-1317), animate (1807-1809): format!(\"status|effect_id|output|notes\\n{}\") ; let _ = fs::write(..) create_dir_all ignored at 517,518,820,976,1210,1596 ``` Failures show up later and somewhere else: a missing output directory produces per-image save errors, or CI reports a missing CSV, instead of one clear message naming the path. Three copies of the report format can drift apart, and consumers such as `generate-lut-thumbs.mjs` and the Playwright specs parse that format. ##### Expected Impact - An I/O failure becomes an immediate, clearly named non-zero exit. - One `write_report(dir, name, lines)` helper owns the CSV format. - Assumption: CI relies on these reports existing (based on ci.yml and the e2e scripts).", "rec": "Add `fn write_report(path, lines) -> io::Result\u003c()>` that holds the shared header, and have the callers turn an Err into an eprintln and `ExitCode::from(2)`. Do the same for `create_dir_all`. When the writes succeed, behaviour is unchanged; when they fail, the tool now says so. Code owners: Cosmic Crafter \u003c61487138+theCosmicCrafter@users.noreply.github.com>", "phase": "P7"}, {"id": "sfind-a3c5edd4608a42a1bd8a0bc14079762e", "sev": "medium", "title": "scan_gate reports PASS when a scanner errors (missing binary or unparseable output)", "cat": "swallowed-error", "files": ["tools/mcp-security.py:106-120", "tools/mcp-security.py:16-35", "tools/mcp-security.py:44-56"], "pr": "", "rem": "", "desc": "##### Overview Each `run_*` tool catches every exception and returns `{\"status\": \"error\"}`. `scan_gate` then counts as blocking only statuses outside `(\"clean\", \"error\")`, so an errored scanner is treated the same as a clean one. If semgrep, gitleaks or bandit is not installed, `subprocess.run` raises `FileNotFoundError`. That exception happens outside the try, so the whole MCP tool call fails. If a scanner runs but emits non-JSON, for example a CLI or usage error, the gate returns `PASS`. ##### Maintainability Cost ``` semgrep prints error text -> json.loads raises -> {status: \"error\"} -> scan_gate: not blocked -> gate: PASS semgrep not installed -> FileNotFoundError at subprocess.run (outside try) -> tool crashes instead of reporting ``` AGENTS.md, SECURITY.md and `.devin/agents/vidar/AGENT.md` document this as the repo's security gate bridge for agents. A gate that fails open on tool errors gives agents a false PASS. The error handling is also inconsistent: subprocess failures escape, parse failures are swallowed, and the same try/except shape is copy-pasted across three functions. `gitleaks` gets no `raw` stderr field, unlike the other two. ##### Expected Impact - Scanner failures become visible gate outcomes instead of silent PASSes. - One shared runner removes the three drifted copies of the error handling.", "rec": "Make `scan_gate` block (or return a distinct `ERROR` gate) when any result has status `error`. Extract a `_run_json(cmd)` helper that wraps `subprocess.run`, including `FileNotFoundError` and non-zero exit, plus JSON parsing, and always returns stderr on error. Successful scans are unaffected; only the outcome for failed scans changes. Code owners: Cosmic Crafter \u003c61487138+theCosmicCrafter@users.noreply.github.com>", "phase": "P7"}, {"id": "sfind-cb0aae3c5a224f648ee052fa91e1a45f", "sev": "low", "title": "Console-window allow-list justified as 'CLI-only' although the code is a registered GUI IPC command", "cat": "convention-violation", "files": ["scripts/check-no-console-windows.mjs:60-62", "src-tauri/src/commands.rs:257-261", "src-tauri/src/effects/functional_tests.rs:504-520", "src-tauri/src/effects/functional_tests.rs:591-593"], "pr": "", "rem": "", "desc": "##### Overview This file spawns ffmpeg and python with bare `std::process::Command::new`. That is exempted from the repo's no-console-window rule because the file supposedly runs only in a terminal. But `run_all_function_tests` is also exposed as the `test_all_functions` Tauri command, registered in lib.rs. The two ffmpeg testsrc spawn blocks are also copy-pasted. ##### Maintainability Cost ``` check-no-console-windows.mjs:60 \"allowed ... in the CLI verifier's own tests, which run in a terminal\" lib.rs:175 generate_handler![.. test_all_functions ..] -> commands.rs:260 run_all_function_tests() ``` The exemption rests on a false premise. Invoked from the webview, these spawns pop console windows, which is the exact defect proc.rs exists to prevent. The allow-list entry also means future spawns in this file escape the guard. Impact is low because the UI does not currently call the command. ##### Expected Impact - The guard script needs no exemption for this file. - Assumes `crate::proc::command` is a drop-in `Command` builder, which its other uses suggest.", "rec": "Replace the three `std::process::Command::new` calls with `crate::proc::command` (same builder API, no console window), extract a `make_test_video(path)` helper for the two identical ffmpeg blocks, and remove functional_tests.rs from RUST_ALLOWED. CLI behaviour is unchanged. Code owners: Cosmic Crafter \u003c61487138+theCosmicCrafter@users.noreply.github.com>", "phase": "P7"}, {"id": "sfind-cd0e2ddee2c842a9adddf92b0d45fedc", "sev": "low", "title": "Preset save/load tests fall back to asserting the header is visible when the target is not found", "cat": "swallowed-error", "files": ["tests/e2e/preset-panel.spec.ts:46-74"], "pr": "", "rem": "", "desc": "##### Overview \"preset save dialog doesn't crash\" and \"preset load doesn't crash\" only act `if (await x.isVisible().catch(() => false))`, and then assert `header` is visible. If the selectors stop matching, both tests pass without touching presets. The file's own comment criticises exactly this pattern in the earlier version (\"asserted \u003cheader> was visible instead and would have passed with the panel deleted\"), but these two tests still follow it. ##### Maintainability Cost ``` selector misses -> isVisible().catch(()=>false) -> skip action -> expect(header).toBeVisible() -> PASS ``` The class-substring selectors (`[class*='preset-item']`) are fragile, so a rename silently turns these into no-op tests. ##### Expected Impact - Preset UI regressions actually fail the suite.", "rec": "Open the Presets panel the same way the other tests in the file do, assert the save button and preset items are visible, and assert the resulting dialog or effect stack state instead of the header. Code owners: Cosmic Crafter \u003c61487138+theCosmicCrafter@users.noreply.github.com>", "phase": "P7"}, {"id": "sfind-28c0f1fa3ed14883aabf1db2f2ba84e0", "sev": "low", "title": "Stress tests swallow app-load failure and skip by console.log+return, reporting passes when nothing ran", "cat": "swallowed-error", "files": ["tests/e2e/stress-test.spec.ts:20-24", "tests/e2e/stress-test.spec.ts:4-15", "tests/e2e/stress-test.spec.ts:91-94"], "pr": "", "rem": "", "desc": "##### Overview Each test does `waitForSelector('.app-container').catch(() => {})`, so if the app never mounts the test carries on. When no presets or sliders are found, it does `console.log(\"... skipping\"); return;`, which Playwright records as a pass rather than a skip. Every interaction is wrapped in an empty catch. Together, a stress suite that exercised nothing reports green. ##### Maintainability Cost ``` app fails to mount -> waitForSelector rejection discarded -> 0 buttons -> body text non-empty -> PASS no presets -> console.log + return -> reported PASS, not SKIPPED ``` The file's own header comment shows this already hid a real problem: the onboarding overlay blocked every click for the whole suite unnoticed, because \"most tests here swallow every click failure\". Swallowing individual random clicks is reasonable in fuzz-style tests. Swallowing the precondition and turning skips into passes is not. ##### Expected Impact - An app-load failure or a missing panel shows up as a fail or skip instead of a false pass. - Assumption: the per-click catches stay, since random clicks on disabled controls are expected to fail.", "rec": "Drop the `.catch(() => {})` on the `.app-container` wait so a mount failure fails the test. Replace each `console.log(...); return;` with `test.skip(true, reason)`. Keep the per-interaction catches. Passing runs behave the same; only the reporting of broken runs changes. Code owners: Cosmic Crafter \u003c61487138+theCosmicCrafter@users.noreply.github.com>", "phase": "P7"}, {"id": "sfind-8ed8b105d12d4633a93dc08ecaedbcab", "sev": "low", "title": "Two hand-copied Tauri mocks have drifted in shared command responses", "cat": "duplicated-logic", "files": ["tests/e2e/mocks/tauri-mock-with-media.ts:25-72", "tests/e2e/mocks/tauri-mock.ts:47-78"], "pr": "", "rem": "", "desc": "##### Overview `tauri-mock-with-media.ts` is a full copy of `tauri-mock.ts`: localStorage reset, effect list, window and dialog stubs, and the invoke dispatcher. The only intended difference is that media is loaded. Merging them into one base mock plus overrides would stop shared responses drifting apart without anyone noticing. ##### Maintainability Cost ``` tauri-mock.ts sam3_clear: null ffglitch_ok: false mask PNG = white 1x1 tauri-mock-with-media sam3_clear: \"cleared\" ffglitch_ok: true mask PNG = different 1x1 ``` Some differences are deliberate (`get_media_info`). Others, like the `sam3_clear` return type, the ffglitch availability and the mask PNG, look accidental, and specs that switch mocks quietly get different backend behavior. Any new IPC command has to be added to both 141/165-line string blobs by hand. ##### Expected Impact - New commands are mocked once. - The media variant reduces to a small, readable set of overrides, so its intent is obvious. - Assumption: the `sam3_clear` and `ffglitch_ok` differences are not relied on by specific specs. I didn't verify this.", "rec": "Build both scripts from one template, e.g. `buildTauriMock({ mediaLoaded: true, overrides: {...} })`, which serializes a shared response table merged with per-variant overrides. Keep only the deliberate differences as overrides so specs keep the behavior they see today. Code owners: Cosmic Crafter \u003c61487138+theCosmicCrafter@users.noreply.github.com>", "phase": "P7"}]}</script>
