name: Secret Scan

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  trufflehog:
    name: TruffleHog Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install TruffleHog
        run: |
          latest=$(curl -s https://api.github.com/repos/trufflesecurity/trufflehog/releases/latest | grep '"tag_name":' | sed -E 's/.*"([^"]+)".*/\1/')
          curl -L -o /tmp/trufflehog.tar.gz "https://github.com/trufflesecurity/trufflehog/releases/download/${latest}/trufflehog_${latest#v}_linux_amd64.tar.gz"
          tar -xzf /tmp/trufflehog.tar.gz -C /usr/local/bin
          chmod +x /usr/local/bin/trufflehog

      - name: Scan git history for secrets
        run: |
          trufflehog git file://. --since-commit=HEAD~50 --only-verified --fail
