name: Secret Scan

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  trufflehog:
    name: TruffleHog Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan for verified secrets
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          # --only-verified means TruffleHog claims every hit here is a live,
          # working credential -- but the Lob detector (lob.com's `test_`/
          # `live_`-prefixed API key format) has produced repeated "verified"
          # false positives on ordinary Rust test declarations, because
          # `#[test]\nfn test_<long_snake_case_name>()` is shaped enough like
          # `test_<31 hex chars>` to match its regex. Confirmed by reading the
          # exact flagged lines directly (src-tauri/src/effects/glitch/
          # sorting_glitch.rs:526,530 and datamoshing/classic.rs:250 as of
          # 2026-08-08): each is a plain #[test] fn declaration with zero
          # credential-shaped content, Lob or otherwise. Excluding only the
          # Lob detector, not the scan itself, so every other detector (a
          # real leaked secret of any other kind) still fails this check.
          extra_args: --only-verified --exclude-detectors=Lob
