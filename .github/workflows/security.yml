name: Security Gate

on:
  push:
    branches: [master, dev]
  pull_request:

permissions:
  contents: read
  security-events: write
  actions: read

# NOTE ON SARIF UPLOADS
#
# This repository is PRIVATE and does not have GitHub Advanced Security, so
# `github/codeql-action/upload-sarif` fails with:
#
#     Code scanning is not enabled for this repository.
#
# That is a repository/billing setting, not a code defect -- and it was failing
# every scanning job here regardless of what the scanners actually found. A red
# check that means "SARIF plumbing unavailable" trains people to ignore red
# checks.
#
# So the gate is now the SCANNER'S OWN EXIT CODE: each tool fails this workflow
# when it finds something at its configured severity. The SARIF upload is
# best-effort telemetry (`continue-on-error: true`) and starts working
# automatically if Advanced Security is ever enabled.

jobs:
  # ── SEMGREP ──────────────────────────────────────────────────
  semgrep:
    name: Semgrep SAST
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep
    steps:
      - uses: actions/checkout@v4
      # --exclude keeps the scan on this project's own code. Without it semgrep
      # also walked references/ (~1 GB of vendored third-party repositories),
      # the SAM3 Python environments and node_modules, reporting other projects'
      # findings as ours and taking far longer.
      #
      # --error makes semgrep exit non-zero on findings. That IS the gate here,
      # because the SARIF upload cannot work on this repository (see the note at
      # the top of this file).
      - run: |
          semgrep scan \
            --config=p/security-audit \
            --config=p/owasp-top-ten \
            --config=p/secrets \
            --exclude=references --exclude=sam3_env --exclude=sam3_repo \
            --exclude=audit_venv --exclude=node_modules --exclude=recycling \
            --exclude=dist --exclude=target --exclude=venv \
            --severity=ERROR \
            --error \
            --sarif > semgrep.sarif
      # Semgrep reports "0 findings" for a match under a `# nosemgrep:` marker
      # but still writes it to the SARIF with `suppressions: [{kind:
      # inSource}]`, and GitHub code scanning does not honour SARIF
      # suppressions: each one became an open "Semgrep OSS" alert that failed
      # the PR check (first seen on PR #54 -- the two signed-off markers in
      # mosh_cli.py and download-sam3-checkpoint.py). The suppression and its
      # rationale live next to the code; drop those results here so the
      # upload carries only what the scan itself counts.
      - name: Drop results suppressed in source
        run: |
          jq '.runs[].results |= map(select((.suppressions // []) | length == 0))' \
            semgrep.sarif > semgrep.upload.sarif
          echo "kept $(jq '[.runs[].results[]] | length' semgrep.upload.sarif) of $(jq '[.runs[].results[]] | length' semgrep.sarif) results"
      - uses: github/codeql-action/upload-sarif@v3
        continue-on-error: true
        with:
          sarif_file: semgrep.upload.sarif
          category: semgrep

  # ── CODEQL ───────────────────────────────────────────────────
  codeql:
    name: CodeQL Semantic Analysis
    runs-on: ubuntu-latest
    strategy:
      matrix:
        language: [python, javascript]
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          queries: security-and-quality
          # Without this CodeQL also analysed references/, the SAM3 checkouts
          # and the Python virtualenvs -- ~6.5 GB of other people's code.
          config-file: ./.github/codeql/codeql-config.yml
      # autobuild is a no-op for Python and JavaScript (neither needs a compile
      # step for CodeQL), but on failure it stops the whole job before analyze
      # runs. For Python it tried to resolve requirements.txt, which pulls torch
      # and CUDA wheels. Neither language needs it, so let it fail soft.
      - uses: github/codeql-action/autobuild@v3
        continue-on-error: true
      # analyze() uploads its results the same way, so it cannot succeed while
      # code scanning is disabled for this repository. The database build and
      # query evaluation still run and their output is in the job log, which is
      # the useful part today. Drop continue-on-error the moment Advanced
      # Security is enabled -- CodeQL is the strongest analyser here and should
      # be a hard gate.
      - uses: github/codeql-action/analyze@v3
        continue-on-error: true
        with:
          category: codeql-${{ matrix.language }}

  # ── SECRETS (FULL HISTORY) ────────────────────────────────────
  trufflehog:
    name: TruffleHog — git history secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          # No explicit base/head: the action derives the commit range from
          # the event (before..sha on push, base..head on a pull request),
          # which is what secret-scan.yml does and why that job passes.
          # Pinning `base: master` made every push TO master a `master..master`
          # range, and the action refuses that outright: "BASE and HEAD
          # commits are the same. TruffleHog won't scan anything." -- the
          # first run on the public repo failed on exactly this, not on a
          # finding.
          # See the identical exclusion in secret-scan.yml for the full
          # explanation: the Lob detector has produced repeated "verified"
          # false positives on ordinary Rust `#[test] fn test_<name>()`
          # declarations, confirmed by direct inspection -- no real Lob
          # credential has ever been present. Kept in sync with that job so
          # this one (which scans the same pushed or PR range) does not start
          # failing on the same false positive after a merge.
          extra_args: --only-verified --exclude-detectors=Lob

  # ── SNYK CODE ────────────────────────────────────────────────
  snyk-code:
    name: Snyk Code AI SAST
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: snyk/actions/node@master
        continue-on-error: true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          command: code test
          args: --severity-threshold=high --sarif-file-output=snyk-code.sarif
      # The scan step above is continue-on-error, so when SNYK_TOKEN is unset
      # (or Snyk is unreachable) it fails quietly and never writes the SARIF --
      # and then THIS step failed on a missing file. Guarding on the file means
      # a missing token degrades to "no Snyk results" rather than a red check
      # that says nothing about the code.
      - uses: github/codeql-action/upload-sarif@v3
        if: hashFiles('snyk-code.sarif') != ''
        continue-on-error: true
        with:
          sarif_file: snyk-code.sarif
          category: snyk-code

  # ── PYTHON-SPECIFIC ───────────────────────────────────────────
  bandit:
    name: Bandit Python SAST
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # bandit has no built-in SARIF writer -- `-f sarif` fails with
      # "invalid choice: 'sarif'". The formatter is a separate package.
      - run: pip install bandit[toml] bandit-sarif-formatter
      - run: |
          # Exclusions must match .pre-commit-config.yaml, or CI and the local
          # gate disagree about what "clean" means. The original list missed
          # ./references (~1 GB of vendored third-party repositories), the SAM3
          # trees and the recycling bin, so this job scanned other people's code
          # and reported their findings as ours.
          bandit -r . -ll -f sarif -o bandit.sarif \
            --exclude ./tests,./venv,./node_modules,./sam3_env,./audit_venv,./references,./sam3_repo,./recycling,./dist,./src-tauri/target,./packages/python-backend/venv,./packages/python-backend/sam3_repo
          # No `|| true`: bandit exiting 1 on a finding IS the gate, since the
          # SARIF upload cannot work on this repository.
      - uses: github/codeql-action/upload-sarif@v3
        continue-on-error: true
        with:
          sarif_file: bandit.sarif
          category: bandit

  # ── SCA / DEPS ────────────────────────────────────────────────
  trivy:
    name: Trivy SCA + Container
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Table format first, purely so the findings are READABLE in the job log.
      # The SARIF step below writes to a file, and the upload cannot succeed on
      # this repository, so a failure there was undiagnosable -- the job went
      # red with no indication of what it found. exit-code 0 here: this step
      # reports, the next one gates.
      - name: Trivy (human-readable report)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          format: table
          severity: HIGH,CRITICAL
          exit-code: '0'
          skip-dirs: references,sam3_env,sam3_repo,audit_venv,node_modules,recycling,dist,src-tauri/target,packages/python-backend/venv

      - uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          format: sarif
          output: trivy.sarif
          severity: HIGH,CRITICAL
          # Same reasoning as semgrep and bandit: without skip-dirs this walks
          # ~6.5 GB of vendored repositories and Python environments.
          skip-dirs: references,sam3_env,sam3_repo,audit_venv,node_modules,recycling,dist,src-tauri/target,packages/python-backend/venv
          # trivy-action defaults to exit-code 0, i.e. it reports findings but
          # never fails. With the SARIF upload unavailable that made this job
          # incapable of gating anything. 1 makes a HIGH/CRITICAL finding fail.
          exit-code: '1'
      - uses: github/codeql-action/upload-sarif@v3
        continue-on-error: true
        with:
          sarif_file: trivy.sarif
          category: trivy

  # ── RUST SUPPLY-CHAIN AUDIT ─────────────────────────────────────
  cargo-deny:
    name: cargo-deny — Rust advisories, licenses, sources
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # The EmbarkStudios action was replaced with a plain invocation.
      #
      # The action supplies its own --manifest-path, so passing one in
      # `arguments` produced:
      #
      #     error: the argument '--manifest-path <MANIFEST_PATH>' cannot be used
      #     multiple times
      #
      # and adding --config to work around a separate problem only compounded
      # it. cargo-deny also resolves deny.toml relative to the CURRENT
      # directory, not the manifest, so running from the repository root never
      # read src-tauri/deny.toml and fell back to built-in defaults that deny
      # far more than this project's policy.
      #
      # Running the binary from src-tauri sidesteps both: deny.toml and
      # Cargo.toml are both right there. This is exactly what the cargo-deny job
      # in ci.yml already does, and that one has always passed.
      - run: cargo install cargo-deny --locked
      - run: cargo deny check
        working-directory: src-tauri

  # ── NODE SUPPLY-CHAIN AUDIT ─────────────────────────────────────
  npm-audit:
    name: npm audit — Node dependency CVEs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high
