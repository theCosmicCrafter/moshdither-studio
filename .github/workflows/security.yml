name: Security Gate

on:
  push:
    branches: [master, dev]
  pull_request:

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  # ── SEMGREP ──────────────────────────────────────────────────
  semgrep:
    name: Semgrep SAST
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep
    steps:
      - uses: actions/checkout@v4
      - run: |
          semgrep scan \
            --config=p/security-audit \
            --config=p/owasp-top-ten \
            --config=p/secrets \
            --sarif > semgrep.sarif
      - uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: semgrep.sarif
          category: semgrep

  # ── CODEQL ───────────────────────────────────────────────────
  codeql:
    name: CodeQL Semantic Analysis
    runs-on: ubuntu-latest
    strategy:
      matrix:
        language: [python, javascript]
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          queries: security-and-quality
      - uses: github/codeql-action/autobuild@v3
      - uses: github/codeql-action/analyze@v3
        with:
          category: codeql-${{ matrix.language }}

  # ── SECRETS (FULL HISTORY) ────────────────────────────────────
  trufflehog:
    name: TruffleHog — git history secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: HEAD
          extra_args: --only-verified

  # ── SNYK CODE ────────────────────────────────────────────────
  snyk-code:
    name: Snyk Code AI SAST
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: snyk/actions/node@master
        continue-on-error: true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          command: code test
          args: --severity-threshold=high --sarif-file-output=snyk-code.sarif
      - uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: snyk-code.sarif
          category: snyk-code

  # ── PYTHON-SPECIFIC ───────────────────────────────────────────
  bandit:
    name: Bandit Python SAST
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install bandit[toml]
      - run: |
          bandit -r . -ll -f sarif -o bandit.sarif \
            --exclude ./tests,./venv,./node_modules,./sam3_env,./audit_venv
      - uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: bandit.sarif
          category: bandit

  # ── SCA / DEPS ────────────────────────────────────────────────
  trivy:
    name: Trivy SCA + Container
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          format: sarif
          output: trivy.sarif
          severity: HIGH,CRITICAL
      - uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy.sarif
          category: trivy

  # ── RUST SUPPLY-CHAIN AUDIT ─────────────────────────────────────
  cargo-deny:
    name: cargo-deny — Rust advisories, licenses, sources
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
          arguments: --manifest-path src-tauri/Cargo.toml

  # ── NODE SUPPLY-CHAIN AUDIT ─────────────────────────────────────
  npm-audit:
    name: npm audit — Node dependency CVEs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high
