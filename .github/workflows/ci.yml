name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  desktop-gui:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/desktop-gui
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: packages/desktop-gui/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npx tsc -b

      - name: Build
        run: npm run build

      - name: Unit tests
        run: npx vitest run

  python-backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/python-backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Create virtual environment
        run: python -m venv venv

      - name: Install dependencies
        run: |
          venv/bin/pip install -r requirements.txt
          venv/bin/pip install pytest

      - name: Run Python tests
        run: venv/bin/pytest || echo "No tests found yet"
