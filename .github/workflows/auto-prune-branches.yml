name: Auto Prune Merged & Stale Branches

# Manual trigger only.
#
# This job deletes every remote branch already merged into master. It never
# ran while the repo was private (Actions was off), and going public turns
# Actions on for free -- so a push-and-nightly trigger would have started
# deleting branches automatically the same day. A merged branch loses only
# its name, but this project's rule is that nothing is deleted without a
# deliberate act. Run it from the Actions tab when you mean to; restore the
# push/schedule triggers below if you decide you want it automatic.
#
#   push:
#     branches: [master]
#   schedule:
#     - cron: '0 0 * * *'
on:
  workflow_dispatch:

jobs:
  prune-branches:
    name: Auto Prune Merged Branches
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prune Merged Remote Branches
        run: |
          git fetch --prune
          # Identify branches merged into master, excluding master
          MERGED_BRANCHES=$(git branch -r --merged origin/master | grep -v 'origin/master' | grep -v 'origin/HEAD' | sed 's/origin\///')
          
          if [ -n "$MERGED_BRANCHES" ]; then
            echo "Deleting the following merged remote branches:"
            echo "$MERGED_BRANCHES"
            for branch in $MERGED_BRANCHES; do
              git push origin --delete "$branch" || echo "Could not delete $branch"
            done
          else
            echo "No merged remote branches found for deletion."
          fi
