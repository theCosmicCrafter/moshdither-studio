[package]
name = "moshdither-studio"
version = "0.1.0"
description = "A unified desktop app for datamoshing, dithering, and glitch art"
authors = ["MoshDither Studio Contributors"]
license = "MIT"
repository = ""
edition = "2021"
rust-version = "1.75"

[build-dependencies]
tauri-build = { version = "2.0.0", features = [] }

[dependencies]
tauri = { version = "2.0.0", features = [] }
tauri-plugin-dialog = "2.0.0"
tauri-plugin-shell = "2.0.0"

image = "0.25"
rayon = "1.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
rand = "0.8"
base64 = "0.22"
parking_lot = "0.12"
hmac = "0.12"
sha2 = "0.10"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
