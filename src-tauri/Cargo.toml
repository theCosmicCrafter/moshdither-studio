[package]
name = "moshdither-studio"
version = "0.2.0"
description = "A unified desktop app for datamoshing, dithering, and glitch art"
authors = ["MoshDither Studio Contributors"]
license = "MIT"
repository = ""
edition = "2021"
rust-version = "1.88"
default-run = "moshdither-studio"

[lib]
name = "moshdither_studio_lib"
crate-type = ["rlib", "staticlib", "cdylib"]

[build-dependencies]
tauri-build = { version = "2.0.0", features = [] }

[dependencies]
tauri = { version = "2.0.0", features = ["macos-private-api", "protocol-asset"] }
tauri-plugin-dialog = "2.0.0"
image = "0.25"
rayon = "1.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
rand = "0.8"
base64 = "0.22"
parking_lot = "0.12"
child_wait_timeout = "0.1.0"
sysinfo = "0.38"
tokio = { version = "1", features = ["sync"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# SAM3 add-on downloader. rustls rather than native-tls so the build does not
# depend on a system OpenSSL; stream so a multi-GB asset is written to disk as
# it arrives instead of being buffered whole in memory.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "http2"] }
futures-util = "0.3"
sha2 = "0.10"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

# Standalone CLI for running effect verification without the Tauri runtime.
# Usage: cargo run --bin mosh-verify -- [options]
#        mosh-verify verify-all [--format json|text]
#        mosh-verify verify-effect <effect_id>
#        mosh-verify list-effects [--category <cat>]
[[bin]]
name = "mosh-verify"
path = "src/bin/mosh_verify.rs"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2.0.0"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_UI_Shell",
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    # SetUnhandledExceptionFilter, so hard faults (access violations, stack
    # overflows) are recorded to the log before the process dies. They never
    # reach the Rust panic hook -- they are CPU exceptions, not panics.
    "Win32_System_Diagnostics_Debug",
    # EXCEPTION_POINTERS lives behind this one.
    "Win32_System_Kernel",
] }

[dev-dependencies]
# Drives the async downloader in tests; the app itself runs on Tauri's runtime.
tokio = { version = "1", features = ["rt", "macros"] }
