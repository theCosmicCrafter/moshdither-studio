# .pre-commit-config.yaml
# Install: pip install pre-commit && pre-commit install
# Run manually: pre-commit run --all-files

repos:
  # ── SECRETS ──────────────────────────────────────────────────
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks
        name: "gitleaks — secret scan"

  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        name: "detect-secrets — baseline diff"
        args: ['--baseline', '.secrets.baseline']

  # ── MULTI-LANG SAST ───────────────────────────────────────────
  - repo: https://github.com/returntocorp/semgrep
    rev: v1.82.0
    hooks:
      - id: semgrep
        name: "semgrep — multi-lang SAST"
        args:
          - '--config=p/security-audit'
          - '--config=p/secrets'
          - '--config=p/owasp-top-ten'
          - '--error'
          - '--severity=ERROR'

  # ── PYTHON ───────────────────────────────────────────────────
  - repo: https://github.com/PyCQA/bandit
    rev: 1.8.3
    hooks:
      - id: bandit
        name: "bandit — Python SAST"
        args: ['-r', '.', '-ll', '-x', 'tests/,venv/,sam3_env/,audit_venv/']

  # ── JS / TS / NODE ────────────────────────────────────────────
  - repo: https://github.com/ajinabraham/njsscan
    rev: v0.4.4
    hooks:
      - id: njsscan
        name: "njsscan — JS/Node SAST"
        args: ['--exit-warning', '.']

  # ── DEPS ─────────────────────────────────────────────────────
  - repo: https://github.com/pypa/pip-audit
    rev: v2.8.0
    hooks:
      - id: pip-audit
        name: "pip-audit — Python CVE check"
        args: ['--desc', '--progress-spinner=off']
